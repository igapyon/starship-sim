<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Starship Simulation v2 - Modular Design</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        body {
            background: #000;
            font-family: 'Courier New', monospace;
            overflow: hidden;
            width: 100%;
            height: 100%;
            position: fixed;
        }
        canvas {
            display: block;
            background: #001a33;
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #0f0;
            font-size: 11px;
            line-height: 1.4;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px;
            border: 1px solid #0f0;
            z-index: 10;
            max-width: 200px;
        }
        #controls {
            position: absolute;
            bottom: 10px;
            left: 10px;
            color: #0f0;
            font-size: 10px;
            background: rgba(0, 0, 0, 0.8);
            padding: 8px;
            border: 1px solid #0f0;
            z-index: 10;
            max-width: 280px;
        }
        #thruster-btn {
            position: absolute;
            bottom: 10px;
            right: 10px;
            width: 60px;
            height: 60px;
            border: 2px solid #0f0;
            background: rgba(0, 50, 0, 0.7);
            color: #0f0;
            font-weight: bold;
            font-size: 12px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            transition: all 0.2s;
        }
        #thruster-btn:active, #thruster-btn.on {
            background: rgba(0, 100, 0, 0.9);
            box-shadow: 0 0 20px #0f0;
        }
        #test-buttons {
            position: absolute;
            top: 10px;
            right: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 10;
        }
        .test-btn {
            padding: 8px 12px;
            background: rgba(0, 50, 100, 0.7);
            color: #0f0;
            border: 1px solid #0f0;
            cursor: pointer;
            font-size: 11px;
            font-family: 'Courier New', monospace;
            transition: all 0.2s;
        }
        .test-btn:hover {
            background: rgba(0, 100, 150, 0.9);
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div id="info"></div>
    <div id="controls">
        <div>画面タッチで操作</div>
        <div>モジュラー構成システム</div>
        <div>段階的破壊を実装</div>
    </div>
    <div id="test-buttons">
        <button class="test-btn" data-config="weapon1">船種C1つ</button>
        <button class="test-btn" data-config="weapon4">船種C4つ</button>
        <button class="test-btn" data-config="destroyer1">船種D1つ</button>
        <button class="test-btn" data-config="destroyer1v6">船種D1vs敵4</button>
        <button class="test-btn" data-config="destroyervsdestroyer">船種Dvs船種D</button>
        <button class="test-btn" data-config="destroyer4vs4">船種D4vs4</button>
    </div>
    <button id="thruster-btn">スラスタ<br>OFF</button>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const infoDiv = document.getElementById('info');
        const thrusterBtn = document.getElementById('thruster-btn');

        function resizeCanvas() {
            const dpr = window.devicePixelRatio || 1;
            canvas.width = window.innerWidth * dpr;
            canvas.height = window.innerHeight * dpr;
            ctx.scale(dpr, dpr);
        }
        resizeCanvas();

        // ========================================
        // コンポーネント定義
        // ========================================

        // 標準船体（Standard Hull）
        class Hull {
            constructor() {
                this.mass = 1;
                this.hp = 100;
                this.maxHp = 100;
                this.size = 12;
            }

            getCost() {
                return this.mass;
            }
        }

        // 大型船体（Large Hull）
        class LargeHull {
            constructor() {
                this.mass = 3;
                this.hp = 300;
                this.maxHp = 300;
                this.size = 28;
            }

            getCost() {
                return this.mass;
            }
        }

        // 標準推進エンジン（Standard Thruster）
        class ThrusterEngine {
            constructor() {
                this.mass = 1;
                this.thrust = 0.15;  // 推進力
                this.rotationSpeed = 0.05;  // 旋回速度
            }

            getCost() {
                return this.mass;
            }
        }

        // 標準射撃ユニット（Standard Weapon System）
        class WeaponUnit {
            constructor() {
                this.mass = 1;
                this.hp = 100;
                this.maxHp = 100;
                this.fireInterval = 60;
                this.fireCounter = 0;
                this.fireAngle = Math.PI / 12;  // 前方15度
                this.detectionRange = 150;
                this.bulletSpeed = 5;
                this.bulletDamage = 10;
                this.maxRange = 225;  // 索敇範囲の1.5倍
                this.rotationSpeed = 0.05;  // 砲塔の旋回速度
                this.angle = 0;  // 砲塔独自の角度
                this.targetX = 0;  // 砲塔独自の目標X
                this.targetY = 0;  // 砲塔独自の目標Y
            }

            // 砲塔を目標に向けて旋回
            updateAngle(targetX, targetY, currentX, currentY) {
                const dx = targetX - currentX;
                const dy = targetY - currentY;
                const targetAngle = Math.atan2(dy, dx);

                let angleDiff = targetAngle - this.angle;
                if (angleDiff > Math.PI) angleDiff -= 2 * Math.PI;
                if (angleDiff < -Math.PI) angleDiff += 2 * Math.PI;

                this.angle += angleDiff * this.rotationSpeed;
            }

            canFire(targetX, targetY, shipX, shipY) {
                // 索敵範囲チェックのみ（敵がいれば角度関係なく射撃）
                const dx = targetX - shipX;
                const dy = targetY - shipY;
                const distance = Math.hypot(dx, dy);
                return distance <= this.detectionRange;
            }

            fire(x, y) {
                const bulletVx = Math.cos(this.angle) * this.bulletSpeed;
                const bulletVy = Math.sin(this.angle) * this.bulletSpeed;
                const fireX = x + Math.cos(this.angle) * 12;
                const fireY = y + Math.sin(this.angle) * 12;

                return new Bullet(fireX, fireY, bulletVx, bulletVy, x, y, this.bulletDamage, this.maxRange);
            }

            getCost() {
                return this.mass;
            }
        }

        // ========================================
        // 弾丸クラス
        // ========================================

        class Bullet {
            constructor(x, y, vx, vy, originX, originY, damage, maxRange, color = '#ff0') {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.originX = originX;
                this.originY = originY;
                this.damage = damage;
                this.maxRange = maxRange;
                this.color = color;
                this.life = 300;
                this.size = 3;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life--;

                const canvasWidth = canvas.width / window.devicePixelRatio;
                const canvasHeight = canvas.height / window.devicePixelRatio;
                if (this.x < -50 || this.x > canvasWidth + 50 ||
                    this.y < -50 || this.y > canvasHeight + 50) {
                    this.life = 0;
                }

                const dx = this.x - this.originX;
                const dy = this.y - this.originY;
                const distance = Math.hypot(dx, dy);
                if (distance > this.maxRange) {
                    this.life = 0;
                }
            }

            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }

            isAlive() {
                return this.life > 0;
            }

            collidesWith(ship) {
                const dx = this.x - ship.x;
                const dy = this.y - ship.y;
                const distance = Math.hypot(dx, dy);
                return distance < this.size + ship.hull.size;
            }
        }

        // ========================================
        // パーティクルクラス
        // ========================================

        class Particle {
            constructor(x, y, vx, vy, color, size = 3) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.color = color;
                this.size = size;
                this.life = 30;
                this.maxLife = 30;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.05;  // 重力
                this.life--;
            }

            draw() {
                const alpha = this.life / this.maxLife;
                ctx.fillStyle = this.color.replace(')', `, ${alpha})`).replace('rgb', 'rgba');
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }

            isAlive() {
                return this.life > 0;
            }
        }

        // ========================================
        // 艦船クラス（モジュラー構成）
        // ========================================

        class Starship {
            constructor(x, y, weaponCount, engineCount, color = '#fff', isEnemy = false, hullType = 'standard') {
                this.x = x;
                this.y = y;
                this.vx = 0;
                this.vy = 0;
                this.angle = 0;
                this.color = color;
                this.isEnemy = isEnemy;
                this.targetX = x;
                this.targetY = y;
                this.maxSpeed = 2;
                // 陣営Bは初期状態ではスラスターOFF（索敇範囲内に入ったらON）
                this.thrustersActive = !isEnemy;
                // 陣営Bが相手を検出しているか（索敇範囲内にいるか）
                this.detectedTarget = false;

                // コンポーネント構成
                this.hull = hullType === 'large' ? new LargeHull() : new Hull();
                this.weapons = [];
                this.engines = [];

                for (let i = 0; i < weaponCount; i++) {
                    this.weapons.push(new WeaponUnit());
                }
                for (let i = 0; i < engineCount; i++) {
                    this.engines.push(new ThrusterEngine());
                }

                // 射撃ユニット数の上限チェック
                if (this.engines.length > this.weapons.length) {
                    this.engines = this.engines.slice(0, this.weapons.length);
                }

                this.hullExposed = false;  // 船体HPが露出しているか
                this.hasBeenDamaged = false;  // ダメージを受けたかどうか
            }

            // 総質量を計算
            getTotalMass() {
                let mass = this.hull.mass;
                mass += this.weapons.reduce((sum, w) => sum + w.mass, 0);
                mass += this.engines.reduce((sum, e) => sum + e.mass, 0);
                return mass;
            }

            // コストを計算（重量と一致）
            getCost() {
                return this.getTotalMass();
            }

            // 総推進力を計算
            getTotalThrust() {
                return this.engines.reduce((sum, e) => sum + e.thrust, 0);
            }

            // 総旋回速度を計算（質量で割る）
            getTotalRotationSpeed() {
                const totalRotationForce = this.engines.reduce((sum, e) => sum + e.rotationSpeed, 0);
                const totalMass = this.getTotalMass();
                return totalRotationForce / totalMass;
            }

            // 総HPを計算（表示用）
            getTotalHP() {
                if (this.weapons.length === 0) {
                    return this.hull.hp;
                }
                return this.weapons.reduce((sum, w) => sum + w.hp, 0);
            }

            getMaxHP() {
                if (this.weapons.length === 0) {
                    return this.hull.maxHp;
                }
                return this.weapons.reduce((sum, w) => sum + w.maxHp, 0);
            }

            update(targetX, targetY) {
                const canvasWidth = canvas.width / window.devicePixelRatio;
                const canvasHeight = canvas.height / window.devicePixelRatio;

                // 陣営Bの認識距離チェック
                if (this.isEnemy && this.weapons.length > 0) {
                    const dx = targetX - this.x;
                    const dy = targetY - this.y;
                    const distanceToPlayer = Math.hypot(dx, dy);

                    // 索敵範囲内なら目標を陣営Aに設定
                    if (distanceToPlayer < this.weapons[0].detectionRange) {
                        // 索敵範囲内に入ったらスラスターONと検出フラグをON
                        this.thrustersActive = true;
                        this.detectedTarget = true;

                        this.targetX = targetX;
                        this.targetY = targetY;

                        const centerX = canvasWidth / 2;
                        const centerY = canvasHeight / 2;
                        const margin = 100;
                        const correction = 0.6;

                        if (this.x < margin) this.targetX += (centerX - this.targetX) * correction;
                        else if (this.x > canvasWidth - margin) this.targetX += (centerX - this.targetX) * correction;
                        if (this.y < margin) this.targetY += (centerY - this.targetY) * correction;
                        else if (this.y > canvasHeight - margin) this.targetY += (centerY - this.targetY) * correction;
                    } else {
                        // 索敵範囲外：移動しない、検出フラグもOFF
                        this.thrustersActive = false;
                        this.detectedTarget = false;
                        this.targetX = this.x;
                        this.targetY = this.y;
                    }
                } else {
                    this.targetX = targetX;
                    this.targetY = targetY;
                }

                // 砲塔を目標に向けて旋回（大型船体の場合のみ独立砲塔）
                if (this.hull.size > 12) {
                    this.weapons.forEach((weapon, index) => {
                        // 砲塔の実際の位置を計算
                        const offsetY = index === 0 ? -this.hull.size * 0.6 : this.hull.size * 0.6;
                        const rotatedAngle = this.angle - Math.PI / 2;
                        const rotatedX = Math.cos(rotatedAngle) * 0 - Math.sin(rotatedAngle) * offsetY;
                        const rotatedY = Math.sin(rotatedAngle) * 0 + Math.cos(rotatedAngle) * offsetY;
                        const weaponX = this.x + rotatedX;
                        const weaponY = this.y + rotatedY;

                        // 砲塔の位置から共通の目標への角度を計算
                        // 敵が索敇範囲外の場合、this.targetは自身の位置のため砲塔は旋回しない
                        weapon.updateAngle(this.targetX, this.targetY, weaponX, weaponY);
                    });
                } else {
                    // 標準船体の場合、射撃ユニットの角度を船体の角度に同期
                    this.weapons.forEach(weapon => {
                        weapon.angle = this.angle;
                    });
                }

                // 船体の旋回
                if (this.engines.length > 0) {
                    const dx = this.targetX - this.x;
                    const dy = this.targetY - this.y;
                    const targetAngle = Math.atan2(dy, dx);

                    let angleDiff = targetAngle - this.angle;
                    if (angleDiff > Math.PI) angleDiff -= 2 * Math.PI;
                    if (angleDiff < -Math.PI) angleDiff += 2 * Math.PI;

                    const rotSpeed = this.getTotalRotationSpeed();
                    this.angle += angleDiff * rotSpeed;
                }

                // 推進
                if (this.thrustersActive && this.engines.length > 0) {
                    const dx = this.targetX - this.x;
                    const dy = this.targetY - this.y;
                    const targetAngle = Math.atan2(dy, dx);
                    
                    let angleDiff = targetAngle - this.angle;
                    if (angleDiff > Math.PI) angleDiff -= 2 * Math.PI;
                    if (angleDiff < -Math.PI) angleDiff += 2 * Math.PI;

                    const thrustFactor = Math.max(0, Math.cos(angleDiff));
                    const totalThrust = this.getTotalThrust();
                    const totalMass = this.getTotalMass();
                    const acceleration = totalThrust / totalMass;

                    this.vx += Math.cos(this.angle) * acceleration * thrustFactor;
                    this.vy += Math.sin(this.angle) * acceleration * thrustFactor;
                }

                // 画面端の斥力
                const margin = 80;
                const maxRepelStrength = 0.05;
                
                if (this.x < margin) {
                    const distRatio = 1 - (this.x / margin);
                    this.vx += maxRepelStrength * distRatio;
                }
                if (this.x > canvasWidth - margin) {
                    const distRatio = 1 - ((canvasWidth - this.x) / margin);
                    this.vx -= maxRepelStrength * distRatio;
                }
                if (this.y < margin) {
                    const distRatio = 1 - (this.y / margin);
                    this.vy += maxRepelStrength * distRatio;
                }
                if (this.y > canvasHeight - margin) {
                    const distRatio = 1 - ((canvasHeight - this.y) / margin);
                    this.vy -= maxRepelStrength * distRatio;
                }

                // 最高速度制限
                const speed = Math.hypot(this.vx, this.vy);
                if (speed > this.maxSpeed) {
                    this.vx = (this.vx / speed) * this.maxSpeed;
                    this.vy = (this.vy / speed) * this.maxSpeed;
                }

                // 移動
                this.x += this.vx;
                this.y += this.vy;

                // 画面端での反射
                if (this.x < 0 || this.x > canvasWidth) {
                    this.vx *= -1;
                    this.x = Math.max(0, Math.min(canvasWidth, this.x));
                }
                if (this.y < 0 || this.y > canvasHeight) {
                    this.vy *= -1;
                    this.y = Math.max(0, Math.min(canvasHeight, this.y));
                }

                // 摩擦
                this.vx *= 0.98;
                this.vy *= 0.98;

                // 射撃カウンター更新
                this.weapons.forEach(w => w.fireCounter++);
            }

            draw() {
                // 大型船体（船種D）の場合
                if (this.hull.size > 12) {
                    ctx.save();
                    ctx.translate(this.x, this.y);
                    // 90度回転を追加（横向き基準 → 縦向き）
                    ctx.rotate(this.angle - Math.PI / 2);
                    
                    // 船体の色：射撃ユニットがあればオレンジ、なければ本来の色
                    const hullColor = this.weapons.length > 0 ? 'rgba(255, 136, 0, 0.6)' : this.color;
                    
                    // カプセル型の船体（角丸長方形）
                    const bodyWidth = this.hull.size * 0.5;
                    const bodyHeight = this.hull.size * 1.6;
                    const radius = bodyWidth / 2;
                    
                    ctx.fillStyle = hullColor;
                    ctx.beginPath();
                    ctx.arc(0, -bodyHeight/2 + radius, radius, Math.PI, 0, false);
                    ctx.lineTo(bodyWidth/2, bodyHeight/2 - radius);
                    ctx.arc(0, bodyHeight/2 - radius, radius, 0, Math.PI, false);
                    ctx.lineTo(-bodyWidth/2, -bodyHeight/2 + radius);
                    ctx.closePath();
                    ctx.fill();
                    
                    // 船体輪郭
                    ctx.strokeStyle = 'rgba(0, 0, 0, 0.3)';
                    ctx.lineWidth = 1.5;
                    ctx.stroke();
                    
                    // エンジンを後端に描画（小さい長方形）
                    if (this.engines.length > 0) {
                        ctx.fillStyle = 'rgba(100, 100, 100, 0.7)';
                        ctx.fillRect(-6, bodyHeight/2 + 6, 12, 6);
                        ctx.strokeStyle = 'rgba(60, 60, 60, 0.8)';
                        ctx.lineWidth = 1;
                        ctx.strokeRect(-6, bodyHeight/2 + 6, 12, 6);
                    }

                    ctx.restore();

                    // エンジン炎（グローバル座標系で船体後方に描画）
                    if (this.thrustersActive && this.engines.length > 0 && Math.random() > 0.3) {
                        const flameSize = 10 + Math.random() * 6;
                        const flameX = this.x + Math.cos(this.angle + Math.PI) * (this.hull.size * 0.9);
                        const flameY = this.y + Math.sin(this.angle + Math.PI) * (this.hull.size * 0.9);

                        ctx.save();
                        ctx.translate(flameX, flameY);
                        ctx.rotate(this.angle + Math.PI);

                        ctx.fillStyle = 'rgba(255, 50, 0, 0.9)';
                        ctx.beginPath();
                        ctx.moveTo(0, -4);
                        ctx.lineTo(flameSize, 0);
                        ctx.lineTo(0, 4);
                        ctx.closePath();
                        ctx.fill();

                        ctx.restore();
                    }
                    
                    // 独立砲塔を船体の上に描画

                    // 砲塔1（前方/上部）
                    if (this.weapons.length > 0) {
                        ctx.save();
                        ctx.translate(this.x, this.y);

                        // 船体の向きを考慮した砲塔位置（船体座標系での前方）
                        const offsetY = -this.hull.size * 0.6;
                        const rotatedAngle = this.angle - Math.PI / 2;
                        const rotatedX = Math.cos(rotatedAngle) * 0 - Math.sin(rotatedAngle) * offsetY;
                        const rotatedY = Math.sin(rotatedAngle) * 0 + Math.cos(rotatedAngle) * offsetY;

                        ctx.translate(rotatedX, rotatedY);
                        ctx.rotate(this.weapons[0].angle);

                        // 砲塔本体（三角形・船種Cと同じ形状、船種Cと同じ色ルール）
                        ctx.fillStyle = this.color;
                        ctx.beginPath();
                        ctx.moveTo(12, 0);
                        ctx.lineTo(-8.4, -7.2);
                        ctx.lineTo(-6, 0);
                        ctx.lineTo(-8.4, 7.2);
                        ctx.closePath();
                        ctx.fill();
                        
                        ctx.strokeStyle = 'rgba(0, 0, 0, 0.3)';
                        ctx.lineWidth = 1;
                        ctx.stroke();
                        
                        ctx.restore();
                    }
                    
                    // 砲塔2（後方/下部）
                    if (this.weapons.length > 1) {
                        ctx.save();
                        ctx.translate(this.x, this.y);

                        // 船体の向きを考慮した砲塔位置（船体座標系での後方）
                        const offsetY = this.hull.size * 0.6;
                        const rotatedAngle = this.angle - Math.PI / 2;
                        const rotatedX = Math.cos(rotatedAngle) * 0 - Math.sin(rotatedAngle) * offsetY;
                        const rotatedY = Math.sin(rotatedAngle) * 0 + Math.cos(rotatedAngle) * offsetY;

                        ctx.translate(rotatedX, rotatedY);
                        ctx.rotate(this.weapons[1].angle);

                        // 砲塔本体（三角形・船種Cと同じ形状、船種Cと同じ色ルール）
                        ctx.fillStyle = this.color;
                        ctx.beginPath();
                        ctx.moveTo(12, 0);
                        ctx.lineTo(-8.4, -7.2);
                        ctx.lineTo(-6, 0);
                        ctx.lineTo(-8.4, 7.2);
                        ctx.closePath();
                        ctx.fill();

                        ctx.strokeStyle = 'rgba(0, 0, 0, 0.3)';
                        ctx.lineWidth = 1;
                        ctx.stroke();

                        ctx.restore();
                    }
                    
                    // 残骸輪郭
                    if (this.engines.length === 0 && this.weapons.length === 0) {
                        ctx.save();
                        ctx.translate(this.x, this.y);
                        ctx.rotate(this.angle - Math.PI / 2);
                        
                        ctx.strokeStyle = '#fa0';
                        ctx.lineWidth = 3;
                        ctx.beginPath();
                        ctx.arc(0, -bodyHeight/2 + radius, radius, Math.PI, 0, false);
                        ctx.lineTo(bodyWidth/2, bodyHeight/2 - radius);
                        ctx.arc(0, bodyHeight/2 - radius, radius, 0, Math.PI, false);
                        ctx.lineTo(-bodyWidth/2, -bodyHeight/2 + radius);
                        ctx.closePath();
                        ctx.stroke();
                        
                        ctx.restore();
                    }
                    
                } else {
                    // 標準船体（小型艦）
                    ctx.save();
                    ctx.translate(this.x, this.y);
                    ctx.rotate(this.angle);
                    
                    ctx.fillStyle = this.color;
                    ctx.beginPath();
                    ctx.moveTo(this.hull.size, 0);
                    ctx.lineTo(-this.hull.size * 0.7, -this.hull.size * 0.6);
                    ctx.lineTo(-this.hull.size * 0.5, 0);
                    ctx.lineTo(-this.hull.size * 0.7, this.hull.size * 0.6);
                    ctx.closePath();
                    ctx.fill();
                    
                    // 残骸輪郭
                    if (this.engines.length === 0 && this.weapons.length === 0) {
                        ctx.strokeStyle = '#fa0';
                        ctx.lineWidth = 2;
                        ctx.beginPath();
                        ctx.moveTo(this.hull.size, 0);
                        ctx.lineTo(-this.hull.size * 0.7, -this.hull.size * 0.6);
                        ctx.lineTo(-this.hull.size * 0.5, 0);
                        ctx.lineTo(-this.hull.size * 0.7, this.hull.size * 0.6);
                        ctx.closePath();
                        ctx.stroke();
                    }
                    
                    // エンジン炎
                    if (this.thrustersActive && this.engines.length > 0 && Math.random() > 0.3) {
                        ctx.fillStyle = 'rgba(255, 100, 0, 0.8)';
                        const flameLength = 10 + Math.random() * 10;
                        ctx.beginPath();
                        ctx.moveTo(-this.hull.size * 0.9 - flameLength, -5);
                        ctx.lineTo(-this.hull.size * 0.9 - flameLength, 5);
                        ctx.lineTo(-this.hull.size * 0.9, 0);
                        ctx.closePath();
                        ctx.fill();
                    }
                    
                    ctx.restore();
                }

                // HPバー（ダメージ受け時のみ表示）
                if (this.hasBeenDamaged) {
                    const hpBarWidth = 30;
                    const hpBarHeight = 3;
                    const hpBarSpacing = 5;  // バー間のスペース

                    if (this.weapons.length > 0) {
                        // 射撃ユニットが存在する場合：各ユニットごとにHPバーを表示
                        this.weapons.forEach((weapon, index) => {
                            const hpBarX = this.x - hpBarWidth / 2;
                            const hpBarY = this.y - this.hull.size * 1.8 - 8 - (index * (hpBarHeight + hpBarSpacing));

                            ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
                            ctx.fillRect(hpBarX, hpBarY, hpBarWidth, hpBarHeight);

                            const hpRatio = weapon.hp / weapon.maxHp;
                            ctx.fillStyle = hpRatio > 0.3 ? '#0f0' : '#f00';
                            ctx.fillRect(hpBarX, hpBarY, hpBarWidth * hpRatio, hpBarHeight);

                            ctx.strokeStyle = '#fff';
                            ctx.lineWidth = 1;
                            ctx.strokeRect(hpBarX, hpBarY, hpBarWidth, hpBarHeight);
                        });
                    } else {
                        // 射撃ユニットが破壊された場合：船体HPを表示
                        const hpBarX = this.x - hpBarWidth / 2;
                        const hpBarY = this.y - this.hull.size * 1.8 - 8;

                        ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
                        ctx.fillRect(hpBarX, hpBarY, hpBarWidth, hpBarHeight);

                        const hpRatio = this.hull.hp / this.hull.maxHp;
                        ctx.fillStyle = '#fa0';
                        ctx.fillRect(hpBarX, hpBarY, hpBarWidth * hpRatio, hpBarHeight);

                        ctx.strokeStyle = '#fff';
                        ctx.lineWidth = 1;
                        ctx.strokeRect(hpBarX, hpBarY, hpBarWidth, hpBarHeight);
                    }
                }

                // 索敵範囲
                if (this.weapons.length > 0) {
                    ctx.strokeStyle = this.isEnemy ? 'rgba(0, 150, 255, 0.15)' : 'rgba(0, 255, 0, 0.15)';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.weapons[0].detectionRange, 0, Math.PI * 2);
                    ctx.stroke();
                }
                
                // 残骸円
                if (this.engines.length === 0 && this.isAlive()) {
                    ctx.strokeStyle = 'rgba(255, 170, 0, 0.4)';
                    ctx.lineWidth = 2;
                    ctx.setLineDash([5, 5]);
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.hull.size * 1.8 + 4, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.setLineDash([]);
                }
            }

            shouldFire() {
                if (this.weapons.length === 0) return false;

                // 敵が目標を検出していない場合は射撃しない
                if (this.isEnemy && !this.detectedTarget) return false;

                this.nextFireWeaponIndex = -1;
                for (let i = 0; i < this.weapons.length; i++) {
                    const weapon = this.weapons[i];
                    if (weapon.fireCounter >= weapon.fireInterval) {
                        // 大型船体の場合、砲塔の実際の位置を基準にcanFire判定
                        let weaponX = this.x;
                        let weaponY = this.y;
                        if (this.hull.size > 12) {
                            const offsetY = i === 0 ? -this.hull.size * 0.6 : this.hull.size * 0.6;
                            const rotatedAngle = this.angle - Math.PI / 2;
                            const rotatedX = Math.cos(rotatedAngle) * 0 - Math.sin(rotatedAngle) * offsetY;
                            const rotatedY = Math.sin(rotatedAngle) * 0 + Math.cos(rotatedAngle) * offsetY;
                            weaponX += rotatedX;
                            weaponY += rotatedY;
                        }

                        // 全ての砲塔が共通の目標を使用
                        if (weapon.canFire(this.targetX, this.targetY, weaponX, weaponY)) {
                            weapon.fireCounter = 0;
                            this.nextFireWeaponIndex = i;
                            return true;
                        }
                    }
                }
                return false;
            }

            fire() {
                if (this.weapons.length === 0 || this.nextFireWeaponIndex < 0) return null;

                const weapon = this.weapons[this.nextFireWeaponIndex];
                let fireFromX = this.x;
                let fireFromY = this.y;

                // 大型船体の場合、砲塔の位置から発射
                if (this.hull.size > 12) {
                    const offsetY = this.nextFireWeaponIndex === 0 ? -this.hull.size * 0.6 : this.hull.size * 0.6;
                    const rotatedAngle = this.angle - Math.PI / 2;
                    const rotatedX = Math.cos(rotatedAngle) * 0 - Math.sin(rotatedAngle) * offsetY;
                    const rotatedY = Math.sin(rotatedAngle) * 0 + Math.cos(rotatedAngle) * offsetY;
                    fireFromX += rotatedX;
                    fireFromY += rotatedY;
                }

                const bullet = weapon.fire(fireFromX, fireFromY);
                bullet.color = this.isEnemy ? '#f0f' : '#ff0';
                return bullet;
            }

            takeDamage(amount) {
                this.hasBeenDamaged = true;
                let destroyedCost = 0;
                let particles = [];

                if (this.weapons.length > 0) {
                    // 射撃ユニットにダメージ
                    const weapon = this.weapons[0];
                    weapon.hp -= amount;

                    if (weapon.hp <= 0) {
                        // 射撃ユニット破壊 - コストを記録
                        destroyedCost += weapon.getCost();
                        this.weapons.shift();

                        // エンジン数が射撃ユニット数を超えたらエンジン喪失 - コストを記録
                        while (this.engines.length > this.weapons.length) {
                            const engine = this.engines.pop();
                            destroyedCost += engine.getCost();
                        }

                        particles = this.createSmallExplosion();
                    }
                } else {
                    // 船体にダメージ
                    this.hull.hp -= amount;
                }
                return { particles, cost: destroyedCost };
            }

            isAlive() {
                if (this.weapons.length > 0) return true;
                return this.hull.hp > 0;
            }

            collidesWith(otherShip) {
                const dx = this.x - otherShip.x;
                const dy = this.y - otherShip.y;
                const distance = Math.hypot(dx, dy);
                return distance < this.hull.size + otherShip.hull.size;
            }

            createExplosion() {
                const explosionParticles = [];
                const particleCount = 15;
                const colors = ['rgb(255, 100, 0)', 'rgb(255, 200, 0)', 'rgb(255, 150, 0)', 'rgb(200, 100, 0)'];
                
                for (let i = 0; i < particleCount; i++) {
                    const angle = (i / particleCount) * Math.PI * 2;
                    const speed = 2 + Math.random() * 3;
                    const vx = Math.cos(angle) * speed;
                    const vy = Math.sin(angle) * speed;
                    const color = colors[Math.floor(Math.random() * colors.length)];
                    const size = 3 + Math.random() * 4;
                    
                    explosionParticles.push(new Particle(this.x, this.y, vx, vy, color, size));
                }
                
                return explosionParticles;
            }

            createSmallExplosion() {
                const explosionParticles = [];
                const particleCount = 8;
                const colors = ['rgb(255, 100, 0)', 'rgb(255, 200, 0)'];
                
                for (let i = 0; i < particleCount; i++) {
                    const angle = (i / particleCount) * Math.PI * 2;
                    const speed = 1 + Math.random() * 2;
                    const vx = Math.cos(angle) * speed;
                    const vy = Math.sin(angle) * speed;
                    const color = colors[Math.floor(Math.random() * colors.length)];
                    const size = 2 + Math.random() * 2;
                    
                    explosionParticles.push(new Particle(this.x, this.y, vx, vy, color, size));
                }
                
                return explosionParticles;
            }
        }

        // ========================================
        // ゲーム初期化
        // ========================================

        const canvasWidthBase = canvas.width / window.devicePixelRatio;
        const canvasHeightBase = canvas.height / window.devicePixelRatio;

        let playerFleet = [];
        let enemies = [];
        const bullets = [];
        const particles = [];
        let mouseX = canvasWidthBase / 2;
        let mouseY = canvasHeightBase / 2;

        // コスト追跡
        let initialPlayerCost = 0;
        let initialEnemyCost = 0;
        let lostPlayerCost = 0;
        let lostEnemyCost = 0;

        // ゲーム初期化関数
        function initializeGame(config = 'destroyer1') {
            // コストリセット
            initialPlayerCost = 0;
            initialEnemyCost = 0;
            lostPlayerCost = 0;
            lostEnemyCost = 0;

            // 陣営Aを初期化
            playerFleet = [];

            if (config === 'weapon1') {
                // 船種C1つ：射撃ユニット1、標準船体
                playerFleet.push(new Starship(canvasWidthBase / 2, canvasHeightBase / 2, 1, 1, '#fff', false, 'standard'));
            } else if (config === 'weapon4') {
                // 船種C4つ：それぞれ射撃ユニット1、標準船体
                const spacing = 60;
                playerFleet.push(new Starship(canvasWidthBase / 2 - spacing, canvasHeightBase / 2 - spacing, 1, 1, '#fff', false, 'standard'));
                playerFleet.push(new Starship(canvasWidthBase / 2 + spacing, canvasHeightBase / 2 - spacing, 1, 1, '#fff', false, 'standard'));
                playerFleet.push(new Starship(canvasWidthBase / 2 - spacing, canvasHeightBase / 2 + spacing, 1, 1, '#fff', false, 'standard'));
                playerFleet.push(new Starship(canvasWidthBase / 2 + spacing, canvasHeightBase / 2 + spacing, 1, 1, '#fff', false, 'standard'));
            } else if (config === 'destroyer1') {
                // 船種D1つ：射撃ユニット2、大型船体
                const destroyer = new Starship(canvasWidthBase / 2, canvasHeightBase / 2, 2, 1, '#fff', false, 'large');
                // 船種Dの索敇範囲を船種Cの1.2倍に設定
                destroyer.weapons.forEach(weapon => {
                    weapon.detectionRange = 180;  // 船種C150の1.2倍
                });
                playerFleet.push(destroyer);
            } else if (config === 'destroyer1v6') {
                // 船種D1つ：射撃ユニット2、大型船体
                const destroyer = new Starship(canvasWidthBase / 2, canvasHeightBase / 2, 2, 1, '#fff', false, 'large');
                // 船種Dの索敇範囲を船種Cの1.2倍に設定
                destroyer.weapons.forEach(weapon => {
                    weapon.detectionRange = 180;  // 船種C150の1.2倍
                });
                playerFleet.push(destroyer);
            } else if (config === 'destroyervsdestroyer') {
                // 駆逐艦1つ（陣営A）：射撃ユニット2、大型船体
                const destroyer = new Starship(canvasWidthBase / 2, canvasHeightBase - 80, 2, 1, '#fff', false, 'large');
                // 船種Dの索敇範囲を船種Cの1.2倍に設定
                destroyer.weapons.forEach(weapon => {
                    weapon.detectionRange = 180;  // 船種C150の1.2倍
                });
                playerFleet.push(destroyer);
            }

            // 敵：シーンに応じた配置
            if (config === 'destroyer1v6') {
                // 敵4機を画面上部に矩形配置（2x2）
                enemies = [];
                const startX = canvasWidthBase / 2 - 80;
                const startY = 80;
                const spacing = 120;
                for (let row = 0; row < 2; row++) {
                    for (let col = 0; col < 2; col++) {
                        const x = startX + col * spacing;
                        const y = startY + row * spacing;
                        enemies.push(new Starship(x, y, 1, 1, '#0ff', true));
                    }
                }
            } else if (config === 'destroyervsdestroyer') {
                // 敵陣営：船種D1機を画面上部中央に配置
                enemies = [];
                const x = canvasWidthBase / 2;
                const y = 80;
                const destroyer = new Starship(x, y, 2, 1, '#0ff', true, 'large');
                destroyer.weapons.forEach(weapon => {
                    weapon.detectionRange = 180;  // 船種C150の1.2倍
                });
                enemies.push(destroyer);
            } else if (config === 'destroyer4vs4') {
                // プレイヤー陣営：船種D 4隻を画面下部に配置
                playerFleet = [];
                const playerStartX = canvasWidthBase / 2 - 120;
                const playerStartY = canvasHeightBase - 120;
                const playerSpacing = 120;
                for (let row = 0; row < 2; row++) {
                    for (let col = 0; col < 2; col++) {
                        const x = playerStartX + col * playerSpacing;
                        const y = playerStartY + row * playerSpacing;
                        const destroyer = new Starship(x, y, 2, 1, '#fff', false, 'large');
                        destroyer.weapons.forEach(weapon => {
                            weapon.detectionRange = 180;  // 船種C150の1.2倍
                        });
                        playerFleet.push(destroyer);
                    }
                }
                // 敵陣営：船種D 4隻を画面上部に配置
                enemies = [];
                const enemyStartX = canvasWidthBase / 2 - 120;
                const enemyStartY = 80;
                const enemySpacing = 120;
                for (let row = 0; row < 2; row++) {
                    for (let col = 0; col < 2; col++) {
                        const x = enemyStartX + col * enemySpacing;
                        const y = enemyStartY + row * enemySpacing;
                        const destroyer = new Starship(x, y, 2, 1, '#0ff', true, 'large');
                        destroyer.weapons.forEach(weapon => {
                            weapon.detectionRange = 180;  // 船種C150の1.2倍
                        });
                        enemies.push(destroyer);
                    }
                }
            } else {
                // 通常：敵4機を4隅配置
                enemies = [
                    new Starship(100, 100, 1, 1, '#0ff', true),
                    new Starship(canvasWidthBase - 100, 100, 1, 1, '#0ff', true),
                    new Starship(100, canvasHeightBase - 100, 1, 1, '#0ff', true),
                    new Starship(canvasWidthBase - 100, canvasHeightBase - 100, 1, 1, '#0ff', true)
                ];
            }

            // 初期コストを計算
            initialPlayerCost = playerFleet.reduce((sum, ship) => sum + ship.getCost(), 0);
            initialEnemyCost = enemies.reduce((sum, ship) => sum + ship.getCost(), 0);

            // 弾とパーティクルをリセット
            bullets.length = 0;
            particles.length = 0;
        }

        // 初期化実行（デフォルトは船種D1つ）
        initializeGame('destroyer1');

        // スター背景
        const stars = [];
        for (let i = 0; i < 200; i++) {
            stars.push({
                x: Math.random() * canvasWidthBase,
                y: Math.random() * canvasHeightBase,
                size: Math.random() * 1.5,
                brightness: Math.random() * 0.5 + 0.5
            });
        }

        // ========================================
        // イベントハンドラ
        // ========================================

        function handleMove(e) {
            const rect = canvas.getBoundingClientRect();
            if (e.touches) {
                mouseX = e.touches[0].clientX - rect.left;
                mouseY = e.touches[0].clientY - rect.top;
            } else {
                mouseX = e.clientX - rect.left;
                mouseY = e.clientY - rect.top;
            }
        }

        document.addEventListener('mousemove', handleMove);
        document.addEventListener('touchmove', (e) => {
            e.preventDefault();
            handleMove(e);
        }, { passive: false });

        thrusterBtn.addEventListener('click', () => {
            if (playerFleet.length === 0) return;
            const newState = !playerFleet[0].thrustersActive;
            playerFleet.forEach(ship => {
                ship.thrustersActive = newState;
            });
            thrusterBtn.classList.toggle('on');
            thrusterBtn.textContent = newState ? 'スラスタ\nON' : 'スラスタ\nOFF';
        });

        // テストボタンのイベントハンドラ
        document.querySelectorAll('.test-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const config = btn.dataset.config;
                initializeGame(config);
            });
        });

        document.addEventListener('contextmenu', (e) => e.preventDefault());

        // ========================================
        // メインループ
        // ========================================

        function animate() {
            const canvasWidth = canvas.width / window.devicePixelRatio;
            const canvasHeight = canvas.height / window.devicePixelRatio;

            // 背景
            ctx.fillStyle = '#001a33';
            ctx.fillRect(0, 0, canvasWidth, canvasHeight);

            // 星
            stars.forEach(star => {
                ctx.fillStyle = `rgba(255, 255, 255, ${star.brightness})`;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
            });

            // 目標マーカー
            ctx.strokeStyle = 'rgba(0, 100, 0, 0.3)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(mouseX, mouseY, 30, 0, Math.PI * 2);
            ctx.stroke();

            // 陣営Aの更新と描画
            playerFleet.forEach((ship, index) => {
                // 各艦の目標選択（優先順位システム）
                let targetEnemy = null;
                
                if (ship.weapons.length > 0) {
                    let activeEnemies = [];
                    let wreckEnemies = [];
                    
                    enemies.forEach(enemy => {
                        const dx = enemy.x - ship.x;
                        const dy = enemy.y - ship.y;
                        const distance = Math.hypot(dx, dy);
                        
                        if (distance < ship.weapons[0].detectionRange) {
                            if (enemy.engines.length > 0) {
                                activeEnemies.push({ enemy, distance });
                            } else {
                                wreckEnemies.push({ enemy, distance });
                            }
                        }
                    });
                    
                    if (activeEnemies.length > 0) {
                        activeEnemies.sort((a, b) => a.distance - b.distance);
                        targetEnemy = activeEnemies[0].enemy;
                    } else if (wreckEnemies.length > 0) {
                        wreckEnemies.sort((a, b) => a.distance - b.distance);
                        targetEnemy = wreckEnemies[0].enemy;
                    }
                }
                
                const targetX = targetEnemy ? targetEnemy.x : mouseX;
                const targetY = targetEnemy ? targetEnemy.y : mouseY;
                
                // 更新
                ship.update(targetX, targetY);
                
                // 陣営A同士の衝突判定（斥力）
                for (let j = 0; j < playerFleet.length; j++) {
                    if (j !== index && ship.collidesWith(playerFleet[j])) {
                        const dx = ship.x - playerFleet[j].x;
                        const dy = ship.y - playerFleet[j].y;
                        const dist = Math.hypot(dx, dy);
                        if (dist > 0) {
                            const pushForce = 0.5;
                            ship.vx += (dx / dist) * pushForce;
                            ship.vy += (dy / dist) * pushForce;
                        }
                    }
                }
                
                // 射撃
                if (targetEnemy && ship.shouldFire()) {
                    const bullet = ship.fire();
                    if (bullet) bullets.push(bullet);
                }
                
                // 描画
                ship.draw();
            });

            // 敵更新
            enemies.forEach(enemy => {
                // 最も近い陣営Aを目標にする
                let closestPlayer = null;
                let minDist = Infinity;
                
                playerFleet.forEach(playerShip => {
                    const dx = playerShip.x - enemy.x;
                    const dy = playerShip.y - enemy.y;
                    const dist = Math.hypot(dx, dy);
                    if (dist < minDist) {
                        minDist = dist;
                        closestPlayer = playerShip;
                    }
                });
                
                if (closestPlayer) {
                    enemy.update(closestPlayer.x, closestPlayer.y);
                    
                    // 陣営Aとの衝突判定（斥力）
                    playerFleet.forEach(playerShip => {
                        if (enemy.collidesWith(playerShip)) {
                            const dx = enemy.x - playerShip.x;
                            const dy = enemy.y - playerShip.y;
                            const dist = Math.hypot(dx, dy);
                            if (dist > 0) {
                                const pushForce = 0.5;
                                enemy.vx += (dx / dist) * pushForce;
                                enemy.vy += (dy / dist) * pushForce;
                            }
                        }
                    });
                }
                
                // 陣営B同士の衝突
                for (let j = 0; j < enemies.length; j++) {
                    if (enemies[j] !== enemy && enemy.collidesWith(enemies[j])) {
                        const dx = enemy.x - enemies[j].x;
                        const dy = enemy.y - enemies[j].y;
                        const dist = Math.hypot(dx, dy);
                        if (dist > 0) {
                            const pushForce = 0.5;
                            enemy.vx += (dx / dist) * pushForce;
                            enemy.vy += (dy / dist) * pushForce;
                        }
                    }
                }
                
                // 射撃
                if (enemy.shouldFire()) {
                    const bullet = enemy.fire();
                    if (bullet) bullets.push(bullet);
                }
                
                enemy.draw();
            });

            // 弾更新
            for (let i = bullets.length - 1; i >= 0; i--) {
                bullets[i].update();
                
                if (bullets[i].isAlive()) {
                    // 陣営Aへの当たり判定
                    if (bullets[i].color === '#f0f') {
                        for (let p = 0; p < playerFleet.length; p++) {
                            if (bullets[i].collidesWith(playerFleet[p])) {
                                const damageResult = playerFleet[p].takeDamage(bullets[i].damage);
                                particles.push(...damageResult.particles);
                                lostPlayerCost += damageResult.cost;
                                if (!playerFleet[p].isAlive()) {
                                    particles.push(...playerFleet[p].createExplosion());
                                    lostPlayerCost += playerFleet[p].getCost();
                                    playerFleet.splice(p, 1);
                                }
                                bullets.splice(i, 1);
                                break;
                            }
                        }
                        if (i < 0 || i >= bullets.length) continue;
                    }
                    
                    // 敵への当たり判定
                    for (let j = enemies.length - 1; j >= 0; j--) {
                        if (bullets[i].color === '#ff0' && bullets[i].collidesWith(enemies[j])) {
                            const damageResult = enemies[j].takeDamage(bullets[i].damage);
                            particles.push(...damageResult.particles);
                            lostEnemyCost += damageResult.cost;
                            if (!enemies[j].isAlive()) {
                                particles.push(...enemies[j].createExplosion());
                                lostEnemyCost += enemies[j].getCost();
                                enemies.splice(j, 1);
                            }
                            bullets.splice(i, 1);
                            break;
                        }
                    }
                    
                    if (i >= 0 && i < bullets.length) {
                        bullets[i].draw();
                    }
                } else {
                    bullets.splice(i, 1);
                }
            }

            // パーティクル更新
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                if (particles[i].isAlive()) {
                    particles[i].draw();
                } else {
                    particles.splice(i, 1);
                }
            }

            // 情報表示：コスト情報
            const currentPlayerCost = initialPlayerCost - lostPlayerCost;
            const currentEnemyCost = initialEnemyCost - lostEnemyCost;

            infoDiv.innerHTML = `
<strong>陣営A（白）</strong><br>
初期コスト: ${initialPlayerCost}<br>
失ったコスト: ${lostPlayerCost}<br>
現在: ${currentPlayerCost}<br>
<br>
<strong>陣営B（シアン）</strong><br>
初期コスト: ${initialEnemyCost}<br>
失ったコスト: ${lostEnemyCost}<br>
現在: ${currentEnemyCost}<br>
            `;

            requestAnimationFrame(animate);
        }

        animate();

        window.addEventListener('resize', () => {
            resizeCanvas();
        });
    </script>
</body>
</html>
