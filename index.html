<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Starship Simulation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        body {
            background: #000;
            font-family: Arial, sans-serif;
            overflow: hidden;
            width: 100%;
            height: 100%;
            position: fixed;
        }
        canvas {
            display: block;
            background: #001a33;
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #0f0;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            line-height: 1.4;
            background: rgba(0, 0, 0, 0.7);
            padding: 8px;
            border: 1px solid #0f0;
            z-index: 10;
            max-width: 150px;
        }
        #controls {
            position: absolute;
            bottom: 10px;
            left: 10px;
            right: 10px;
            color: #0f0;
            font-family: 'Courier New', monospace;
            font-size: 10px;
            background: rgba(0, 0, 0, 0.7);
            padding: 8px;
            border: 1px solid #0f0;
            z-index: 10;
            max-width: 250px;
        }
        #thruster-btn {
            position: absolute;
            bottom: 10px;
            right: 10px;
            width: 60px;
            height: 60px;
            border: 2px solid #0f0;
            background: rgba(0, 50, 0, 0.7);
            color: #0f0;
            font-weight: bold;
            font-size: 12px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            transition: all 0.2s;
        }
        #thruster-btn:active {
            background: rgba(0, 100, 0, 0.9);
            box-shadow: 0 0 20px #0f0;
        }
        #thruster-btn.on {
            background: rgba(0, 100, 0, 0.9);
            box-shadow: 0 0 20px #0f0;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div id="info"></div>
    <div id="controls">
        <div>画面をタッチして操作</div>
        <div>緑の円: 目標位置</div>
    </div>
    <button id="thruster-btn">スラスタ<br>OFF</button>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const infoDiv = document.getElementById('info');
        const thrusterBtn = document.getElementById('thruster-btn');

        // デバイスピクセル比を考慮してキャンバスサイズを設定
        function resizeCanvas() {
            const dpr = window.devicePixelRatio || 1;
            canvas.width = window.innerWidth * dpr;
            canvas.height = window.innerHeight * dpr;
            ctx.scale(dpr, dpr);
        }
        resizeCanvas();

        // Particle クラス（爆発パーティクル）
        class Particle {
            constructor(x, y, vx, vy, color, size = 3) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.color = color;
                this.size = size;
                this.life = 30;
                this.maxLife = 30;
                this.gravity = 0.05;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += this.gravity;
                this.life--;
            }

            draw() {
                const alpha = this.life / this.maxLife;
                ctx.fillStyle = this.color.replace(')', `, ${alpha})`).replace('rgb', 'rgba');
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }

            isAlive() {
                return this.life > 0;
            }
        }

        // Bullet クラス
        class Bullet {
            constructor(x, y, vx, vy, color = '#f00', firedByX = x, firedByY = y) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.life = 300;
                this.size = 3;
                this.color = color;
                this.firedByX = firedByX;
                this.firedByY = firedByY;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life--;

                const canvasWidth = canvas.width / window.devicePixelRatio;
                const canvasHeight = canvas.height / window.devicePixelRatio;
                if (this.x < -50 || this.x > canvasWidth + 50 ||
                    this.y < -50 || this.y > canvasHeight + 50) {
                    this.life = 0;
                }
                
                // 射程チェック（索敵範囲の1.5倍）
                const maxRange = DETECTION_RANGE * 1.5;
                const dx = this.x - this.firedByX;
                const dy = this.y - this.firedByY;
                const distance = Math.hypot(dx, dy);
                if (distance > maxRange) {
                    this.life = 0;
                }
            }

            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }

            isAlive() {
                return this.life > 0;
            }

            collidesWith(ship) {
                const dx = this.x - ship.x;
                const dy = this.y - ship.y;
                const distance = Math.hypot(dx, dy);
                return distance < this.size + ship.size;
            }
        }

        // Starship クラス
        class Starship {
            constructor(x, y, color = '#0f0', isEnemy = false) {
                this.x = x;
                this.y = y;
                this.vx = 0;
                this.vy = 0;
                this.angle = 0;
                this.rotationSpeed = 0.05;
                this.thrusterPower = 0.05;
                this.thrustersActive = true;
                this.maxSpeed = 2;
                this.size = 12;
                this.color = color;
                this.isEnemy = isEnemy;
                this.targetX = x;
                this.targetY = y;
                this.hp = 100;
                this.maxHp = 100;
                this.fireCounter = 0;
                this.fireInterval = 60;
            }

            update(targetX, targetY) {
                const canvasWidth = canvas.width / window.devicePixelRatio;
                const canvasHeight = canvas.height / window.devicePixelRatio;

                if (this.isEnemy) {
                    // プレイヤーとの距離を計算
                    const dx = targetX - this.x;
                    const dy = targetY - this.y;
                    const distanceToPlayer = Math.hypot(dx, dy);
                    
                    // 認識距離内の場合のみ動く
                    if (distanceToPlayer < DETECTION_RANGE) {
                        this.targetX = targetX;
                        this.targetY = targetY;
                        
                        const centerX = canvasWidth / 2;
                        const centerY = canvasHeight / 2;
                        const margin = 100;
                        const correction = 0.6;
                        
                        if (this.x < margin) {
                            this.targetX += (centerX - this.targetX) * correction;
                        } else if (this.x > canvasWidth - margin) {
                            this.targetX += (centerX - this.targetX) * correction;
                        }
                        
                        if (this.y < margin) {
                            this.targetY += (centerY - this.targetY) * correction;
                        } else if (this.y > canvasHeight - margin) {
                            this.targetY += (centerY - this.targetY) * correction;
                        }
                    } else {
                        // 認識距離外：何もしない（完全に静止）
                        this.targetX = this.x;
                        this.targetY = this.y;
                        // 目標方向へ向きの調整も行わない
                        return;
                    }
                } else {
                    this.targetX = targetX;
                    this.targetY = targetY;
                }

                const dx = targetX - this.x;
                const dy = targetY - this.y;
                const targetAngle = Math.atan2(dy, dx);

                let angleDiff = targetAngle - this.angle;
                if (angleDiff > Math.PI) angleDiff -= 2 * Math.PI;
                if (angleDiff < -Math.PI) angleDiff += 2 * Math.PI;

                this.angle += angleDiff * this.rotationSpeed;

                if (this.thrustersActive) {
                    const angleDiff = targetAngle - this.angle;
                    let normalizedDiff = angleDiff;
                    if (normalizedDiff > Math.PI) normalizedDiff -= 2 * Math.PI;
                    if (normalizedDiff < -Math.PI) normalizedDiff += 2 * Math.PI;

                    const thrustFactor = Math.max(0, Math.cos(normalizedDiff));

                    this.vx += Math.cos(this.angle) * this.thrusterPower * thrustFactor;
                    this.vy += Math.sin(this.angle) * this.thrusterPower * thrustFactor;
                }

                const margin = 80;
                const maxRepelStrength = 0.05;
                
                if (this.x < margin) {
                    const distRatio = 1 - (this.x / margin);
                    this.vx += maxRepelStrength * distRatio;
                }
                if (this.x > canvasWidth - margin) {
                    const distRatio = 1 - ((canvasWidth - this.x) / margin);
                    this.vx -= maxRepelStrength * distRatio;
                }
                
                if (this.y < margin) {
                    const distRatio = 1 - (this.y / margin);
                    this.vy += maxRepelStrength * distRatio;
                }
                if (this.y > canvasHeight - margin) {
                    const distRatio = 1 - ((canvasHeight - this.y) / margin);
                    this.vy -= maxRepelStrength * distRatio;
                }

                const speed = Math.hypot(this.vx, this.vy);
                if (speed > this.maxSpeed) {
                    this.vx = (this.vx / speed) * this.maxSpeed;
                    this.vy = (this.vy / speed) * this.maxSpeed;
                }

                this.x += this.vx;
                this.y += this.vy;

                if (this.x < 0 || this.x > canvasWidth) {
                    this.vx *= -1;
                    this.x = Math.max(0, Math.min(canvasWidth, this.x));
                }
                if (this.y < 0 || this.y > canvasHeight) {
                    this.vy *= -1;
                    this.y = Math.max(0, Math.min(canvasHeight, this.y));
                }

                this.vx *= 0.98;
                this.vy *= 0.98;

                this.fireCounter++;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);

                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.moveTo(this.size, 0);
                ctx.lineTo(-this.size * 0.7, -this.size * 0.6);
                ctx.lineTo(-this.size * 0.5, 0);
                ctx.lineTo(-this.size * 0.7, this.size * 0.6);
                ctx.closePath();
                ctx.fill();

                if (this.thrustersActive && Math.random() > 0.3) {
                    ctx.fillStyle = 'rgba(255, 100, 0, 0.8)';
                    const flameLength = 10 + Math.random() * 10;
                    ctx.beginPath();
                    ctx.moveTo(-this.size * 0.5, -5);
                    ctx.lineTo(-this.size * 0.5 - flameLength, 0);
                    ctx.lineTo(-this.size * 0.5, 5);
                    ctx.closePath();
                    ctx.fill();
                }

                ctx.restore();

                const hpBarWidth = 24;
                const hpBarHeight = 2;
                const hpBarX = this.x - hpBarWidth / 2;
                const hpBarY = this.y - this.size - 6;

                ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
                ctx.fillRect(hpBarX, hpBarY, hpBarWidth, hpBarHeight);

                const hpRatio = this.hp / this.maxHp;
                ctx.fillStyle = hpRatio > 0.3 ? '#0f0' : '#f00';
                ctx.fillRect(hpBarX, hpBarY, hpBarWidth * hpRatio, hpBarHeight);

                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 1;
                ctx.strokeRect(hpBarX, hpBarY, hpBarWidth, hpBarHeight);
            }

            fire() {
                const bulletSpeed = 5;
                const bulletVx = Math.cos(this.angle) * bulletSpeed;
                const bulletVy = Math.sin(this.angle) * bulletSpeed;
                
                const fireX = this.x + Math.cos(this.angle) * this.size;
                const fireY = this.y + Math.sin(this.angle) * this.size;
                
                const bulletColor = this.isEnemy ? '#f0f' : '#ff0';
                
                return new Bullet(fireX, fireY, bulletVx, bulletVy, bulletColor, this.x, this.y);
            }

            shouldFire() {
                if (this.fireCounter >= this.fireInterval) {
                    const dx = this.targetX - this.x;
                    const dy = this.targetY - this.y;
                    const targetAngle = Math.atan2(dy, dx);
                    
                    let angleDiff = targetAngle - this.angle;
                    
                    if (angleDiff > Math.PI) angleDiff -= 2 * Math.PI;
                    if (angleDiff < -Math.PI) angleDiff += 2 * Math.PI;
                    
                    // 前方15度以内なら射撃
                    if (Math.abs(angleDiff) < Math.PI / 12) {
                        this.fireCounter = 0;
                        return true;
                    }
                }
                return false;
            }

            takeDamage(amount) {
                this.hp -= amount;
            }

            isAlive() {
                return this.hp > 0;
            }

            collidesWith(otherShip) {
                const dx = this.x - otherShip.x;
                const dy = this.y - otherShip.y;
                const distance = Math.hypot(dx, dy);
                return distance < this.size + otherShip.size;
            }

            createExplosion() {
                const explosionParticles = [];
                const particleCount = 15;
                const colors = ['rgb(255, 100, 0)', 'rgb(255, 200, 0)', 'rgb(255, 150, 0)', 'rgb(200, 100, 0)'];
                
                for (let i = 0; i < particleCount; i++) {
                    const angle = (i / particleCount) * Math.PI * 2;
                    const speed = 2 + Math.random() * 3;
                    const vx = Math.cos(angle) * speed;
                    const vy = Math.sin(angle) * speed;
                    const color = colors[Math.floor(Math.random() * colors.length)];
                    const size = 3 + Math.random() * 4;
                    
                    explosionParticles.push(new Particle(this.x, this.y, vx, vy, color, size));
                }
                
                return explosionParticles;
            }
        }

        // ゲーム設定
        const DETECTION_RANGE = 150; // 敵艦の認識距離

        const canvasWidthBase = canvas.width / window.devicePixelRatio;
        const canvasHeightBase = canvas.height / window.devicePixelRatio;

        const ship = new Starship(canvasWidthBase / 2, canvasHeightBase / 2, '#fff', false);
        let enemies = [
            new Starship(100, 100, '#0ff', true),
            new Starship(canvasWidthBase - 100, 100, '#0ff', true),
            new Starship(100, canvasHeightBase - 100, '#0ff', true),
            new Starship(canvasWidthBase - 100, canvasHeightBase - 100, '#0ff', true)
        ];
        const bullets = [];
        const particles = [];
        let mouseX = canvasWidthBase / 2;
        let mouseY = canvasHeightBase / 2;

        // マウス/タッチイベント
        function handleMove(e) {
            const rect = canvas.getBoundingClientRect();
            if (e.touches) {
                mouseX = e.touches[0].clientX - rect.left;
                mouseY = e.touches[0].clientY - rect.top;
            } else {
                mouseX = e.clientX - rect.left;
                mouseY = e.clientY - rect.top;
            }
        }

        document.addEventListener('mousemove', handleMove);
        document.addEventListener('touchmove', (e) => {
            e.preventDefault();
            handleMove(e);
        }, { passive: false });

        // スラスタボタン
        thrusterBtn.addEventListener('click', () => {
            ship.thrustersActive = !ship.thrustersActive;
            thrusterBtn.classList.toggle('on');
            thrusterBtn.textContent = ship.thrustersActive ? 'スラスタ\nON' : 'スラスタ\nOFF';
        });

        document.addEventListener('contextmenu', (e) => {
            e.preventDefault();
        });

        // スター背景を生成
        const stars = [];
        for (let i = 0; i < 200; i++) {
            stars.push({
                x: Math.random() * canvasWidthBase,
                y: Math.random() * canvasHeightBase,
                size: Math.random() * 1.5,
                brightness: Math.random() * 0.5 + 0.5
            });
        }

        // メインループ
        function animate() {
            const canvasWidth = canvas.width / window.devicePixelRatio;
            const canvasHeight = canvas.height / window.devicePixelRatio;

            ctx.fillStyle = '#001a33';
            ctx.fillRect(0, 0, canvasWidth, canvasHeight);

            stars.forEach(star => {
                ctx.fillStyle = `rgba(255, 255, 255, ${star.brightness})`;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
            });

            ctx.strokeStyle = 'rgba(0, 100, 0, 0.3)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(mouseX, mouseY, 30, 0, Math.PI * 2);
            ctx.stroke();

            // 索敵範囲内の一番近い敵を選択
            let targetEnemy = null;
            let minDistance = Infinity;
            
            enemies.forEach(enemy => {
                const dx = enemy.x - ship.x;
                const dy = enemy.y - ship.y;
                const distance = Math.hypot(dx, dy);
                // 索敵範囲内かつ一番近い敵を選択
                if (distance < DETECTION_RANGE && distance < minDistance) {
                    minDistance = distance;
                    targetEnemy = enemy;
                }
            });
            
            // 索敵範囲内の敵がいれば目標にする、いなければマウス位置を目標
            const targetX = targetEnemy ? targetEnemy.x : mouseX;
            const targetY = targetEnemy ? targetEnemy.y : mouseY;
            
            ship.update(targetX, targetY);

            if (targetEnemy && ship.shouldFire()) {
                bullets.push(ship.fire());
            }
            
            // プレイヤーの索敵範囲を描画
            ctx.strokeStyle = 'rgba(0, 255, 0, 0.2)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.arc(ship.x, ship.y, DETECTION_RANGE, 0, Math.PI * 2);
            ctx.stroke();
            
            ship.draw();

            enemies.forEach(enemy => {
                enemy.update(ship.x, ship.y);
                
                // プレイヤー艦との衝突判定
                if (enemy.collidesWith(ship)) {
                    const dx = enemy.x - ship.x;
                    const dy = enemy.y - ship.y;
                    const dist = Math.hypot(dx, dy);
                    if (dist > 0) {
                        const pushForce = 0.5;
                        enemy.vx += (dx / dist) * pushForce;
                        enemy.vy += (dy / dist) * pushForce;
                    }
                }
                
                // 敵艦同士の衝突判定
                for (let j = 0; j < enemies.length; j++) {
                    if (enemies[j] !== enemy && enemy.collidesWith(enemies[j])) {
                        const dx = enemy.x - enemies[j].x;
                        const dy = enemy.y - enemies[j].y;
                        const dist = Math.hypot(dx, dy);
                        if (dist > 0) {
                            const pushForce = 0.5;
                            enemy.vx += (dx / dist) * pushForce;
                            enemy.vy += (dy / dist) * pushForce;
                        }
                    }
                }
                
                // 認識距離内のみ射撃
                const dx = ship.x - enemy.x;
                const dy = ship.y - enemy.y;
                const distanceToPlayer = Math.hypot(dx, dy);
                
                if (distanceToPlayer < DETECTION_RANGE && enemy.shouldFire()) {
                    bullets.push(enemy.fire());
                }
                
                // 索敵範囲を描画
                ctx.strokeStyle = 'rgba(0, 150, 255, 0.3)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.arc(enemy.x, enemy.y, DETECTION_RANGE, 0, Math.PI * 2);
                ctx.stroke();
                
                enemy.draw();
            });

            for (let i = bullets.length - 1; i >= 0; i--) {
                bullets[i].update();
                
                if (bullets[i].isAlive()) {
                    if (bullets[i].collidesWith(ship)) {
                        ship.takeDamage(10);
                        if (!ship.isAlive()) {
                            particles.push(...ship.createExplosion());
                        }
                        bullets.splice(i, 1);
                        continue;
                    }
                    
                    // 敵の弾がプレイヤーに当たる場合のみ
                    for (let j = enemies.length - 1; j >= 0; j--) {
                        if (bullets[i].collidesWith(enemies[j])) {
                            // プレイヤーの弾のみダメージを与える
                            if (bullets[i].color === '#ff0') {
                                enemies[j].takeDamage(25);
                                if (!enemies[j].isAlive()) {
                                    particles.push(...enemies[j].createExplosion());
                                }
                            }
                            bullets.splice(i, 1);
                            break;
                        }
                    }
                    
                    if (i >= 0 && i < bullets.length) {
                        bullets[i].draw();
                    }
                } else {
                    bullets.splice(i, 1);
                }
            }

            enemies = enemies.filter(enemy => enemy.isAlive());

            // パーティクルの更新と描画
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                if (particles[i].isAlive()) {
                    particles[i].draw();
                } else {
                    particles.splice(i, 1);
                }
            }

            const speed = Math.hypot(ship.vx, ship.vy).toFixed(2);
            const angle = (ship.angle * 180 / Math.PI).toFixed(1);
            infoDiv.innerHTML = `
位置: (${ship.x.toFixed(0)}, ${ship.y.toFixed(0)})<br>
速度: ${speed}<br>
角度: ${angle}°<br>
HP: ${ship.hp.toFixed(0)}/${ship.maxHp}<br>
敵: ${enemies.length}<br>
弾: ${bullets.length}
            `;

            requestAnimationFrame(animate);
        }

        animate();

        // ウィンドウリサイズ対応
        window.addEventListener('resize', () => {
            resizeCanvas();
        });
    </script>
</body>
</html>
