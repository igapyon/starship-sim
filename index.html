<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>starship-sim : Starship Simulation</title>
    <style>
            html, body {
                width: 100%;
                height: 100%;
                overflow: hidden;
            }
            html {
                min-height: -webkit-fill-available;
            }
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
                user-select: none;
                -webkit-user-select: none;
                -webkit-touch-callout: none;
            }
            body {
                background: #000;
                font-family: 'Courier New', monospace;
                overflow: hidden;
                width: 100%;
                height: 100vh;
                min-height: 100vh;
                height: 100dvh;
                min-height: 100dvh;
                min-height: -webkit-fill-available;
                position: fixed;
                inset: 0;
                padding-top: env(safe-area-inset-top, 0px);
                padding-right: env(safe-area-inset-right, 0px);
                padding-bottom: env(safe-area-inset-bottom, 0px);
                padding-left: env(safe-area-inset-left, 0px);
            }
            canvas {
                display: block;
                background: #001a33;
                width: 100%;
                height: 100%;
                touch-action: none;
            }
            #info {
                position: absolute;
                bottom: 8px;
                left: 8px;
                color: #0f0;
                font-size: 9px;
                line-height: 1.25;
                background: rgba(0, 0, 0, 0.45);
                padding: 6px 7px;
                border: 1px solid #0f0;
                z-index: 10;
                max-width: 150px;
            }
            #github-link {
                position: absolute;
                display: inline-flex;
                align-items: center;
                gap: 4px;
                padding: 4px 6px;
                background: rgba(0, 0, 0, 0.45);
                border: 1px solid #0f0;
                color: #0f0;
                text-decoration: none;
                font-size: 10px;
                line-height: 1;
                font-family: 'Courier New', monospace;
                z-index: 10;
            }
            #github-link:hover {
                background: rgba(0, 100, 150, 0.9);
                box-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
            }
            .github-icon {
                width: 12px;
                height: 12px;
                display: block;
            }
            #test-buttons {
                position: absolute;
                display: flex;
                flex-direction: column;
                gap: 6px;
                z-index: 10;
            }
            .test-btn {
                padding: 6px 10px;
                background: rgba(0, 50, 100, 0.7);
                color: #0f0;
                border: 1px solid #0f0;
                cursor: pointer;
                font-size: 10px;
                line-height: 1.1;
                font-family: 'Courier New', monospace;
                transition: all 0.2s;
            }
            .test-btn:hover {
                background: rgba(0, 100, 150, 0.9);
                box-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
            }
            #bottom-controls {
                position: absolute;
                display: flex;
                flex-direction: column;
                align-items: flex-end;
                gap: 8px;
                width: fit-content;
                max-width: calc(100vw - 16px);
                z-index: 10;
            }
            #action-controls {
                display: flex;
                flex-wrap: nowrap;
                align-items: center;
                justify-content: flex-end;
                gap: 6px;
                width: fit-content;
                max-width: 100%;
            }
            #wreckage-toggle {
                padding: 6px 10px;
                background: rgba(0, 50, 100, 0.7);
                color: #0f0;
                border: 1px solid #0f0;
                cursor: pointer;
                font-size: 10px;
                line-height: 1.2;
                white-space: nowrap;
                font-family: 'Courier New', monospace;
                transition: all 0.2s;
            }
            #wreckage-toggle:hover {
                background: rgba(0, 100, 150, 0.9);
                box-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
            }
            #wreckage-toggle.active {
                background: rgba(200, 100, 0, 0.8);
                border: 1px solid rgba(255, 200, 0, 0.8);
                color: rgba(255, 200, 0, 0.9);
                box-shadow: 0 0 10px rgba(255, 150, 0, 0.6);
            }
            #beacon-controls {
                display: flex;
                flex-wrap: nowrap;
                justify-content: flex-end;
                gap: 4px;
                width: fit-content;
            }
            .beacon-team-btn {
                display: inline-flex;
                align-items: center;
                gap: 4px;
                padding: 6px 8px;
                background: rgba(0, 50, 100, 0.7);
                color: #0f0;
                border: 1px solid #0f0;
                cursor: pointer;
                font-size: 12px;
                font-weight: bold;
                line-height: 1;
                font-family: 'Courier New', monospace;
                transition: all 0.2s;
            }
            .beacon-icon {
                width: 12px;
                height: 12px;
                fill: none;
                stroke: currentColor;
                stroke-width: 1.2;
                stroke-linecap: round;
                stroke-linejoin: round;
            }
            .beacon-label {
                min-width: 0.7em;
                text-align: center;
            }
            .beacon-team-btn:hover {
                background: rgba(0, 100, 150, 0.9);
                box-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
            }
            .beacon-team-btn.active {
                background: rgba(100, 200, 255, 0.8);
                border: 2px solid rgba(153, 221, 255, 0.9);
                color: rgba(51, 181, 255, 1);
                box-shadow: 0 0 10px rgba(153, 221, 255, 0.6);
            }
            #zoom-controls {
                position: absolute;
                right: 8px;
                bottom: 8px;
                width: fit-content;
                max-width: calc(100vw - 16px);
                padding: 5px 8px;
                background: transparent;
                color: #0f0;
                font-size: 10px;
                line-height: 1.1;
                font-family: 'Courier New', monospace;
                z-index: 10;
            }
            #zoom-stepper {
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 10px;
            }
            #zoom-value {
                min-width: 38px;
                text-align: center;
                font-weight: bold;
                font-size: 16px;
                line-height: 1;
            }
            #zoom-out, #zoom-in {
                -webkit-appearance: none;
                appearance: none;
                touch-action: manipulation;
                width: 38px;
                height: 38px;
                padding: 0;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                border: none;
                background: transparent;
                box-shadow: none;
                color: #0f0;
                font-family: 'Courier New', monospace;
                cursor: pointer;
            }
            .zoom-icon {
                width: 34px;
                height: 34px;
                fill: none;
                stroke: currentColor;
                stroke-width: 1.6;
                stroke-linecap: round;
                stroke-linejoin: round;
            }
            #zoom-out:disabled, #zoom-in:disabled {
                opacity: 0.35;
                cursor: default;
            }
            #zoom-out:hover:not(:disabled), #zoom-in:hover:not(:disabled) {
                color: #66ff66;
            }
            #zoom-out:focus, #zoom-in:focus {
                outline: none;
                box-shadow: none;
            }
        </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <a
        id="github-link"
        href="https://github.com/igapyon/starship-sim"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="GitHub repository"
    >
        <svg aria-hidden="true" viewBox="0 0 16 16" class="github-icon" fill="currentColor">
            <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/>
        </svg>
        <span>GitHub</span>
    </a>
    <!-- 左下：情報パネル（チームA：水色の情報表示） -->
    <div id="info"></div>
    <div id="test-buttons">
        <button class="test-btn" data-config="mixed1c8vsmixed1c8">L1D2C8</button>
        <button class="test-btn" data-config="corvette8vsdestroyer2">C8vsD2</button>
        <button class="test-btn" data-config="lightcruiser1vsdestroyer2">L1vsD2</button>
        <button class="test-btn" data-config="mass_d1c8">Mass D1C8</button>
        <button class="test-btn" data-config="threeway_l1d4c32">L1D4C16</button>
    </div>
    <div id="zoom-controls">
        <div id="zoom-stepper">
            <button id="zoom-out" type="button" aria-label="Zoom out">
                <svg class="zoom-icon" viewBox="0 0 16 16" aria-hidden="true">
                    <circle cx="6.5" cy="6.5" r="4.5"></circle>
                    <line x1="10.2" y1="10.2" x2="14" y2="14"></line>
                    <line x1="4.2" y1="6.5" x2="8.8" y2="6.5"></line>
                </svg>
            </button>
            <span id="zoom-value">1x</span>
            <button id="zoom-in" type="button" aria-label="Zoom in">
                <svg class="zoom-icon" viewBox="0 0 16 16" aria-hidden="true">
                    <circle cx="6.5" cy="6.5" r="4.5"></circle>
                    <line x1="10.2" y1="10.2" x2="14" y2="14"></line>
                    <line x1="4.2" y1="6.5" x2="8.8" y2="6.5"></line>
                    <line x1="6.5" y1="4.2" x2="6.5" y2="8.8"></line>
                </svg>
            </button>
        </div>
    </div>
    <div id="bottom-controls">
        <div id="action-controls">
            <!-- ビーコン配置チーム選択 -->
            <div id="beacon-controls">
                <button class="beacon-team-btn active" data-team="A" aria-label="Beacon team A">
                    <svg class="beacon-icon" viewBox="0 0 16 16" aria-hidden="true">
                        <circle cx="8" cy="8" r="1.5"></circle>
                        <path d="M8 4.5a3.5 3.5 0 0 1 0 7"></path>
                        <path d="M8 2a6 6 0 0 1 0 12"></path>
                        <path d="M8 4.5a3.5 3.5 0 0 0 0 7"></path>
                        <path d="M8 2a6 6 0 0 0 0 12"></path>
                    </svg>
                    <span class="beacon-label">A</span>
                </button>
                <button class="beacon-team-btn" data-team="B" aria-label="Beacon team B">
                    <svg class="beacon-icon" viewBox="0 0 16 16" aria-hidden="true">
                        <circle cx="8" cy="8" r="1.5"></circle>
                        <path d="M8 4.5a3.5 3.5 0 0 1 0 7"></path>
                        <path d="M8 2a6 6 0 0 1 0 12"></path>
                        <path d="M8 4.5a3.5 3.5 0 0 0 0 7"></path>
                        <path d="M8 2a6 6 0 0 0 0 12"></path>
                    </svg>
                    <span class="beacon-label">B</span>
                </button>
                <button class="beacon-team-btn" data-team="C" aria-label="Beacon team C">
                    <svg class="beacon-icon" viewBox="0 0 16 16" aria-hidden="true">
                        <circle cx="8" cy="8" r="1.5"></circle>
                        <path d="M8 4.5a3.5 3.5 0 0 1 0 7"></path>
                        <path d="M8 2a6 6 0 0 1 0 12"></path>
                        <path d="M8 4.5a3.5 3.5 0 0 0 0 7"></path>
                        <path d="M8 2a6 6 0 0 0 0 12"></path>
                    </svg>
                    <span class="beacon-label">C</span>
                </button>
            </div>
            <!-- 残骸攻撃トグルボタン -->
            <button id="wreckage-toggle">残骸を無視する</button>
        </div>
    </div>

    <script>
    // @ts-nocheck
    const WORLD_SIZE = 720;
    const MIN_ZOOM = 0.5;
    const AUTO_FOCUS_DELAY_MS = 3000;
    const SHIP_PICK_TOLERANCE = 8;
    const ZOOM_STEPS = [0.4, 0.5, 0.625, 0.75, 0.875, 1, 1.25, 1.5, 1.75, 2, 3, 4];
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const infoDiv = document.getElementById('info');
    const githubLink = document.getElementById('github-link');
    const testButtons = document.getElementById('test-buttons');
    const bottomControls = document.getElementById('bottom-controls');
    const zoomControls = document.getElementById('zoom-controls');
    const zoomOutButton = document.getElementById('zoom-out');
    const zoomInButton = document.getElementById('zoom-in');
    const zoomValueLabel = document.getElementById('zoom-value');
    let hasInitializedZoom = false;
    let hasUserAdjustedZoom = false;
    const renderState = {
        dpr: 1,
        viewportWidth: 0,
        viewportHeight: 0,
        worldScale: 1,
        offsetX: 0,
        offsetY: 0,
        zoomLevels: [MIN_ZOOM, 1],
        zoom: 1
    };
    const followState = {
        selectedShip: null,
        preferredTeamId: null,
        lastKnownX: WORLD_SIZE / 2,
        lastKnownY: WORLD_SIZE / 2,
        pendingAutoFocusAt: 0,
        forceCenterOnNextFrame: false
    };
    function getAllShips() {
        if (typeof TEAM_IDS === 'undefined' || typeof teamShips === 'undefined')
            return [];
        return TEAM_IDS.flatMap((teamId) => teamShips[teamId] || []);
    }
    function getShipTeamId(ship) {
        if (!ship || typeof TEAM_IDS === 'undefined' || typeof teamShips === 'undefined')
            return null;
        for (const teamId of TEAM_IDS) {
            const ships = teamShips[teamId] || [];
            if (ships.includes(ship))
                return teamId;
        }
        if (typeof TEAM_COLORS !== 'undefined') {
            for (const teamId of TEAM_IDS) {
                if (TEAM_COLORS[teamId] === ship.color)
                    return teamId;
            }
        }
        return null;
    }
    function getPreferredAliveShip(preferredTeamId) {
        const hasPropulsion = (ship) => ship && ship.isAlive() && ship.engines && ship.engines.length > 0;
        if (preferredTeamId && typeof teamShips !== 'undefined') {
            const preferredShips = teamShips[preferredTeamId] || [];
            for (const ship of preferredShips) {
                if (hasPropulsion(ship))
                    return ship;
            }
        }
        // 同陣営に候補がいない場合でも、まずは推進力ありを優先
        const allShips = getAllShips();
        for (const ship of allShips) {
            if (hasPropulsion(ship))
                return ship;
        }
        return null;
    }
    function selectFollowShip(ship, forceCenter = true) {
        followState.selectedShip = ship || null;
        if (ship) {
            followState.lastKnownX = ship.x;
            followState.lastKnownY = ship.y;
            const teamId = getShipTeamId(ship);
            if (teamId)
                followState.preferredTeamId = teamId;
        }
        followState.pendingAutoFocusAt = 0;
        followState.forceCenterOnNextFrame = forceCenter;
    }
    function isShipFollowable(ship) {
        if (!ship || !ship.isAlive())
            return false;
        if (!ship.engines || ship.engines.length === 0)
            return false;
        return getAllShips().includes(ship);
    }
    function isWorldFullyVisible() {
        const worldPixelSize = WORLD_SIZE * renderState.zoom;
        return worldPixelSize <= renderState.viewportWidth && worldPixelSize <= renderState.viewportHeight;
    }
    function isShipFollowModeActive() {
        const beaconTeam = getSelectedBeaconTeamSafe();
        if (typeof beaconTeam === 'undefined')
            return false;
        return beaconTeam === null && !isWorldFullyVisible();
    }
    function getSelectedBeaconTeamSafe() {
        try {
            return selectedBeaconTeam;
        }
        catch {
            return undefined;
        }
    }
    function getFocusPoint() {
        const followModeActive = isShipFollowModeActive();
        if (!followModeActive) {
            followState.pendingAutoFocusAt = 0;
            return null;
        }
        // 追尾モード開始時に選択がない場合は、生存船先頭へ自動フォーカスする
        if (!followState.selectedShip) {
            const nextShip = getPreferredAliveShip(followState.preferredTeamId);
            if (nextShip) {
                selectFollowShip(nextShip, true);
                return { x: nextShip.x, y: nextShip.y };
            }
        }
        if (isShipFollowable(followState.selectedShip)) {
            followState.pendingAutoFocusAt = 0;
            followState.lastKnownX = followState.selectedShip.x;
            followState.lastKnownY = followState.selectedShip.y;
            const selectedTeamId = getShipTeamId(followState.selectedShip);
            if (selectedTeamId)
                followState.preferredTeamId = selectedTeamId;
            return { x: followState.selectedShip.x, y: followState.selectedShip.y };
        }
        if (followState.selectedShip) {
            followState.lastKnownX = followState.selectedShip.x;
            followState.lastKnownY = followState.selectedShip.y;
        }
        const now = performance.now();
        if (followState.pendingAutoFocusAt === 0) {
            followState.pendingAutoFocusAt = now + AUTO_FOCUS_DELAY_MS;
            return { x: followState.lastKnownX, y: followState.lastKnownY };
        }
        if (now < followState.pendingAutoFocusAt) {
            return { x: followState.lastKnownX, y: followState.lastKnownY };
        }
        const nextShip = getPreferredAliveShip(followState.preferredTeamId);
        if (nextShip) {
            selectFollowShip(nextShip, true);
            return { x: nextShip.x, y: nextShip.y };
        }
        followState.pendingAutoFocusAt = 0;
        followState.selectedShip = null;
        return { x: followState.lastKnownX, y: followState.lastKnownY };
    }
    function computeCenteredOffset(viewportSize, worldPixelSize, targetWorldPos) {
        const desiredOffset = Math.floor(viewportSize / 2 - targetWorldPos * renderState.worldScale);
        const minOffset = Math.floor(viewportSize - worldPixelSize);
        if (minOffset <= 0) {
            return clamp(desiredOffset, minOffset, 0);
        }
        return Math.floor((viewportSize - worldPixelSize) / 2);
    }
    function formatZoomLabel(zoom) {
        if (!Number.isFinite(zoom) || zoom <= 0)
            return '100%';
        return `${Math.max(1, Math.round(zoom * 100))}%`;
    }
    function updateZoomControls() {
        const maxFittableZoom = Math.min(renderState.viewportWidth, renderState.viewportHeight) / WORLD_SIZE;
        const alwaysMinZoom = 0.4;
        const alwaysMaxZoom = 2;
        const selectableMaxZoom = Math.max(maxFittableZoom, alwaysMaxZoom);
        const levels = ZOOM_STEPS.filter((zoom) => (zoom >= alwaysMinZoom && zoom <= alwaysMaxZoom) ||
            (zoom > alwaysMaxZoom && zoom <= selectableMaxZoom + 0.000001));
        if (levels.length === 0)
            levels.push(MIN_ZOOM);
        if (levels.length === 1) {
            const nextLevel = ZOOM_STEPS.find((zoom) => zoom > levels[0]);
            if (nextLevel !== undefined)
                levels.push(nextLevel);
        }
        renderState.zoomLevels = levels;
        if (!Number.isFinite(renderState.zoom) || renderState.zoom <= 0) {
            renderState.zoom = 1;
        }
        const currentIndex = levels.indexOf(renderState.zoom);
        if (currentIndex === -1) {
            let nearest = levels[0];
            let bestDelta = Math.abs(renderState.zoom - nearest);
            for (const level of levels) {
                const delta = Math.abs(renderState.zoom - level);
                if (delta < bestDelta) {
                    nearest = level;
                    bestDelta = delta;
                }
            }
            renderState.zoom = nearest;
        }
        const nextIndex = levels.indexOf(renderState.zoom);
        zoomOutButton.disabled = nextIndex <= 0;
        zoomInButton.disabled = nextIndex >= levels.length - 1;
        zoomValueLabel.textContent = formatZoomLabel(renderState.zoom);
    }
    function getInitialFitZoom() {
        const maxFittableZoom = Math.min(renderState.viewportWidth, renderState.viewportHeight) / WORLD_SIZE;
        const fitLevels = ZOOM_STEPS.filter((zoom) => zoom <= maxFittableZoom + 0.000001);
        if (fitLevels.length > 0)
            return fitLevels[fitLevels.length - 1];
        // 画面が極端に小さい場合は最小ズームで開始
        return ZOOM_STEPS[0];
    }
    function recomputeRenderState() {
        const worldPixelSize = WORLD_SIZE * renderState.zoom;
        renderState.worldScale = renderState.zoom;
        const focusPoint = getFocusPoint();
        if (!focusPoint) {
            renderState.offsetX = Math.floor((renderState.viewportWidth - worldPixelSize) / 2);
            renderState.offsetY = Math.floor((renderState.viewportHeight - worldPixelSize) / 2);
            return;
        }
        const focusX = clamp(focusPoint.x, 0, WORLD_SIZE);
        const focusY = clamp(focusPoint.y, 0, WORLD_SIZE);
        if (followState.forceCenterOnNextFrame) {
            renderState.offsetX = computeCenteredOffset(renderState.viewportWidth, worldPixelSize, focusX);
            renderState.offsetY = computeCenteredOffset(renderState.viewportHeight, worldPixelSize, focusY);
            followState.forceCenterOnNextFrame = false;
            return;
        }
        // 追尾モード中は選択船を常時センタリング（全体が収まる場合はcomputeCenteredOffset内で固定表示）
        renderState.offsetX = computeCenteredOffset(renderState.viewportWidth, worldPixelSize, focusX);
        renderState.offsetY = computeCenteredOffset(renderState.viewportHeight, worldPixelSize, focusY);
    }
    function resetFollowSelectionState() {
        followState.selectedShip = null;
        followState.preferredTeamId = null;
        followState.lastKnownX = WORLD_SIZE / 2;
        followState.lastKnownY = WORLD_SIZE / 2;
        followState.pendingAutoFocusAt = 0;
        followState.forceCenterOnNextFrame = false;
        recomputeRenderState();
        requestAnimationFrame(layoutUi);
    }
    function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
    }
    function layoutUi() {
        const margin = 8;
        const worldPixelSize = WORLD_SIZE * renderState.worldScale;
        const worldLeft = renderState.offsetX;
        const worldTop = renderState.offsetY;
        const worldRight = worldLeft + worldPixelSize;
        const worldBottom = worldTop + worldPixelSize;
        const leftGutter = worldLeft - margin;
        const rightGutter = renderState.viewportWidth - worldRight - margin;
        const topGutter = worldTop - margin;
        const bottomGutter = renderState.viewportHeight - worldBottom - margin;
        function placeTopLeft(element) {
            const width = element.offsetWidth;
            const height = element.offsetHeight;
            let left;
            let top;
            if (leftGutter >= width) {
                left = worldLeft - width - margin;
                top = worldTop;
            }
            else if (topGutter >= height) {
                left = worldLeft;
                top = worldTop - height - margin;
            }
            else {
                left = margin;
                top = margin;
            }
            element.style.left = `${Math.round(clamp(left, margin, renderState.viewportWidth - width - margin))}px`;
            element.style.top = `${Math.round(clamp(top, margin, renderState.viewportHeight - height - margin))}px`;
        }
        function placeTopRight(element) {
            const width = element.offsetWidth;
            const height = element.offsetHeight;
            let left;
            let top;
            if (rightGutter >= width) {
                left = worldRight + margin;
                top = worldTop;
            }
            else if (topGutter >= height) {
                left = worldRight - width;
                top = worldTop - height - margin;
            }
            else {
                left = renderState.viewportWidth - width - margin;
                top = margin;
            }

    class Bullet {
        constructor(x, y, vx, vy, originX, originY, damage, maxRange, color = '#ffffff') {
            this.x = x;
            this.y = y;
            this.vx = vx;
            this.vy = vy;
            this.originX = originX;
            this.originY = originY;
            this.damage = damage;
            this.maxRange = maxRange;
            this.color = color;
            this.life = 300;
            this.size = 3;
        }
        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.life--;
            if (this.x < -50 || this.x > WORLD_SIZE + 50 ||
                this.y < -50 || this.y > WORLD_SIZE + 50) {
                this.life = 0;
            }
            const dx = this.x - this.originX;
            const dy = this.y - this.originY;
            const distance = Math.hypot(dx, dy);
            if (distance > this.maxRange) {
                this.life = 0;
            }
        }
        draw() {
            ctx.fillStyle = this.color;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
        }
        isAlive() {
            return this.life > 0;
        }
        collidesWith(ship) {
            const dx = this.x - ship.x;
            const dy = this.y - ship.y;
            const distance = Math.hypot(dx, dy);
            return distance < this.size + ship.getCollisionRadius();
        }
    }
    // ========================================
    // パーティクルクラス
    // ========================================
    class Particle {
        constructor(x, y, vx, vy, color, size = 3) {
            this.x = x;
            this.y = y;
            this.vx = vx;
            this.vy = vy;
            this.color = color;
            this.size = size;
            this.life = 30;
            this.maxLife = 30;
        }
        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.vy += 0.05; // 重力
            this.life--;
        }
        draw() {
            const alpha = this.life / this.maxLife;
            ctx.fillStyle = this.color.replace(')', `, ${alpha})`).replace('rgb', 'rgba');
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
        }
        isAlive() {
            return this.life > 0;
        }
    }
    // ========================================
    // 検出ビーコンクラス
    // ========================================
    class DetectionBeacon {
        constructor(x, y, teamId, range = SIMULATION_SETTINGS.ai.beaconRangeDefault, duration = 180) {
            this.x = x;
            this.y = y;
            this.teamId = teamId;
            this.range = range; // 検出範囲（設定値）
            this.life = duration; // フレーム数（約3秒）
            this.maxLife = duration;
        }
        contains(ship) {
            const dx = ship.x - this.x;
            const dy = ship.y - this.y;
            const distance = Math.hypot(dx, dy);
            return distance < this.range;
        }
        update() {
            this.life--;
            return this.life > 0;
        }
        draw() {
            const alpha = this.life / this.maxLife;
            const color = TEAM_DEFINITIONS[this.teamId].color;
            // 16進数カラーをrgbaに変換
            const r = parseInt(color.substr(1, 2), 16);
            const g = parseInt(color.substr(3, 2), 16);
            const b = parseInt(color.substr(5, 2), 16);
            ctx.strokeStyle = `rgba(${r}, ${g}, ${b}, ${alpha * 0.5})`;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.range, 0, Math.PI * 2);
            ctx.stroke();
            // 中心マーク
            ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${alpha * 0.7})`;
            ctx.beginPath();
            ctx.arc(this.x, this.y, 4, 0, Math.PI * 2);
            ctx.fill();
        }
        isAlive() {
            return this.life > 0;
        }
    }
    
    // @ts-nocheck
    // ========================================
    // 艦船クラス（モジュラー構成）
    // ========================================
    class Starship {
        constructor(x, y, weaponCount, engineCount, color = TEAM_COLORS.A, hullType = 'hullA', weaponClass = IndependentTurretB) {
            this.x = x;
            this.y = y;
            this.vx = 0;
            this.vy = 0;
            this.angle = 0;
            this.color = color;
            this.targetX = x;
            this.targetY = y;
            this.targetVx = 0; // 目標の速度X（偏差撃ち用）
            this.targetVy = 0; // 目標の速度Y（偏差撃ち用）
            this.maxSpeed = SIMULATION_SETTINGS.physics.maxSpeed;
            // 初期状態ではスラスターOFF（索敇範囲内に入ったらON）
            this.thrustersActive = false;
            // 相手を検出しているか（索敇範囲内にいるか）
            this.detectedTarget = false;
            // コンポーネント構成
            if (hullType === 'hullC') {
                this.hull = new HullC();
            }
            else if (hullType === 'hullB') {
                this.hull = new HullB();
            }
            else {
                this.hull = new HullA();
            }
            this.weapons = [];
            this.engines = [];
            this.radar = null;
            this.radarCount = 0;
            for (let i = 0; i < weaponCount; i++) {
                this.weapons.push(new weaponClass());
            }
            for (let i = 0; i < engineCount; i++) {
                this.engines.push(new ThrusterEngine());
            }
            // 船体タイプごとにレーダーを搭載
            if (hullType === 'hullB') {
                this.radar = new RadarB();
                this.radarCount = 1;
            }
            else if (hullType === 'hullC') {
                this.radar = new RadarC();
                this.radarCount = 1;
            }
            else {
                this.radar = new RadarA();
                this.radarCount = 1;
            }
            // 射撃ユニット数の上限チェック
            if (this.engines.length > this.weapons.length) {
                this.engines = this.engines.slice(0, this.weapons.length);
            }
            this.hullExposed = false; // 船体HPが露出しているか
            this.hasBeenDamaged = false; // ダメージを受けたかどうか
        }
        getTurretOffsetY(index) {
            const count = this.weapons.length;
            if (count <= 1)
                return 0;
            if (count === 2) {
                return index === 0 ? -this.hull.size * 0.6 : this.hull.size * 0.6;
            }
            if (index === 0)
                return -this.hull.size * 0.6;
            if (index === 1)
                return 0;
            return this.hull.size * 0.6;
        }
        // 総質量を計算
        getTotalMass() {
            let mass = this.hull.mass;
            mass += this.weapons.reduce((sum, w) => sum + w.mass, 0);
            mass += this.engines.reduce((sum, e) => sum + e.mass, 0);
            if (this.radar)
                mass += this.radar.mass * this.radarCount;
            return mass;
        }
        // 船体見た目に寄せた当たり判定半径
        getCollisionRadius() {
            if (this.hull.size === 47)
                return 31; // HullC
            if (this.hull.size === 28)
                return 20; // HullB
            return 11; // HullA
        }
        // コストを計算（重量と一致）
        getCost() {
            return this.getTotalMass();
        }
        // 総推進力を計算
        getTotalThrust() {
            return this.engines.reduce((sum, e) => sum + e.thrust, 0);
        }
        // 総旋回速度を計算（質量で割る）
        getTotalRotationSpeed() {
            const totalRotationForce = this.engines.reduce((sum, e) => sum + e.rotationSpeed, 0);
            const totalMass = this.getTotalMass();
            return totalRotationForce / totalMass;
        }
        // 総HPを計算（表示用）
        getTotalHP() {
            if (this.weapons.length === 0) {
                return this.hull.hp;
            }
            return this.weapons.reduce((sum, w) => sum + w.hp, 0);
        }
        getMaxHP() {
            if (this.weapons.length === 0) {
                return this.hull.maxHp;
            }
            return this.weapons.reduce((sum, w) => sum + w.maxHp, 0);
        }
        // 索敵距離はレーダー基準。互換のため未搭載時のみ武装値へフォールバック。
        getDetectionRange() {
            return this.radar.detectionRange;
        }
        update(targetX, targetY, skipDetectionCheck = false) {
            // 認識距離チェック（目標が指定された場合）
            if (this.weapons.length > 0 && !skipDetectionCheck) {
                const dx = targetX - this.x;
                const dy = targetY - this.y;
                const distanceToTarget = Math.hypot(dx, dy);
                const detectionRange = this.getDetectionRange();
                // 索敵範囲内なら目標を設定
                if (distanceToTarget < detectionRange) {
                    // 索敇範囲内に入ったらスラスターONと検出フラグをON
                    this.thrustersActive = true;
                    this.detectedTarget = true;
                    this.targetX = targetX;
                    this.targetY = targetY;
                    const centerX = WORLD_SIZE / 2;
                    const centerY = WORLD_SIZE / 2;
                    const margin = SIMULATION_SETTINGS.ai.edgeTargetCorrectionMargin;
                    const correction = SIMULATION_SETTINGS.ai.edgeTargetCorrectionFactor;
                    if (this.x < margin)
                        this.targetX += (centerX - this.targetX) * correction;
                    else if (this.x > WORLD_SIZE - margin)
                        this.targetX += (centerX - this.targetX) * correction;
                    if (this.y < margin)
                        this.targetY += (centerY - this.targetY) * correction;
                    else if (this.y > WORLD_SIZE - margin)
                        this.targetY += (centerY - this.targetY) * correction;
                }
                else {
                    // 索敇範囲外：移動しない、検出フラグもOFF
                    this.thrustersActive = false;
                    this.detectedTarget = false;
                    this.targetX = this.x;
                    this.targetY = this.y;
                }
            }
            else if (this.weapons.length > 0 && skipDetectionCheck) {
                // skipDetectionCheck=true の場合：検出距離制限をバイパス（チームAがマウス追従時に使用）
                this.targetX = targetX;
                this.targetY = targetY;
                // thrustersActive と detectedTarget は呼び出し元で既に設定済み
            }
            else {
                this.targetX = targetX;
                this.targetY = targetY;
            }
            // 砲塔を目標に向けて旋回（大型船体の場合のみ独立砲塔）
            if (this.hull.size > 12) {
                this.weapons.forEach((weapon, index) => {
                    // 砲塔の実際の位置を計算
                    const offsetY = this.getTurretOffsetY(index);
                    const rotatedAngle = this.angle - Math.PI / 2;
                    const rotatedX = Math.cos(rotatedAngle) * 0 - Math.sin(rotatedAngle) * offsetY;
                    const rotatedY = Math.sin(rotatedAngle) * 0 + Math.cos(rotatedAngle) * offsetY;
                    const weaponX = this.x + rotatedX;
                    const weaponY = this.y + rotatedY;
                    // 旋回速度0の砲塔は固定砲として船体角に同期させる
                    if (weapon.rotationSpeed === 0) {
                        weapon.angle = this.angle;
                    }
                    else {
                        // 砲塔の位置から共通の目標への角度を計算（偏差撃ち対応）
                        // 敵が索敇範囲外の場合、this.targetは自身の位置のため砲塔は旋回しない
                        weapon.updateAngle(this.targetX, this.targetY, weaponX, weaponY, this.targetVx, this.targetVy);
                    }
                });
            }
            else {
                // 標準船体の場合、射撃ユニットの角度を船体の角度に同期
                this.weapons.forEach(weapon => {
                    weapon.angle = this.angle;
                });
            }
            // 船体の旋回
            if (this.engines.length > 0) {
                let targetAngle;
                // 標準船体の場合、偏差撃ちを考慮
                if (this.hull.size <= 12 && this.weapons.length > 0) {
                    const dx = this.targetX - this.x;
                    const dy = this.targetY - this.y;
                    const distance = Math.hypot(dx, dy);
                    // 弾の飛行時間を計算
                    const bulletSpeed = this.weapons[0].bulletSpeed;
                    const flightTime = distance / bulletSpeed;
                    // 目標の予測位置を計算（偏差撃ち）
                    const predictedX = this.targetX + this.targetVx * flightTime;
                    const predictedY = this.targetY + this.targetVy * flightTime;
                    // 予測位置に向けての角度を計算
                    const predDx = predictedX - this.x;
                    const predDy = predictedY - this.y;
                    targetAngle = Math.atan2(predDy, predDx);
                }
                else {
                    // 大型船体の場合、単純に目標方向に向く
                    const dx = this.targetX - this.x;
                    const dy = this.targetY - this.y;
                    targetAngle = Math.atan2(dy, dx);
                }
                let angleDiff = targetAngle - this.angle;
                if (angleDiff > Math.PI)
                    angleDiff -= 2 * Math.PI;
                if (angleDiff < -Math.PI)
                    angleDiff += 2 * Math.PI;
                const rotSpeed = this.getTotalRotationSpeed();
                this.angle += angleDiff * rotSpeed;
            }
            // 推進
            if (this.thrustersActive && this.engines.length > 0) {
                const dx = this.targetX - this.x;
                const dy = this.targetY - this.y;
                const targetAngle = Math.atan2(dy, dx);
                let angleDiff = targetAngle - this.angle;
                if (angleDiff > Math.PI)
                    angleDiff -= 2 * Math.PI;
                if (angleDiff < -Math.PI)
                    angleDiff += 2 * Math.PI;
                const thrustFactor = Math.max(0, Math.cos(angleDiff));
                const totalThrust = this.getTotalThrust();
                const totalMass = this.getTotalMass();
                const acceleration = totalThrust / totalMass;
                this.vx += Math.cos(this.angle) * acceleration * thrustFactor;
                this.vy += Math.sin(this.angle) * acceleration * thrustFactor;
            }
            // 画面端の斥力
            const margin = SIMULATION_SETTINGS.physics.edgeRepulsionMargin;
            const maxRepelStrength = SIMULATION_SETTINGS.physics.edgeRepulsionStrength;
            if (this.x < margin) {
                const distRatio = 1 - (this.x / margin);
                this.vx += maxRepelStrength * distRatio;
            }
            if (this.x > WORLD_SIZE - margin) {
                const distRatio = 1 - ((WORLD_SIZE - this.x) / margin);
                this.vx -= maxRepelStrength * distRatio;
            }
            if (this.y < margin) {
                const distRatio = 1 - (this.y / margin);
                this.vy += maxRepelStrength * distRatio;
            }
            if (this.y > WORLD_SIZE - margin) {
                const distRatio = 1 - ((WORLD_SIZE - this.y) / margin);
                this.vy -= maxRepelStrength * distRatio;
            }
            // 最高速度制限
            const speed = Math.hypot(this.vx, this.vy);
            if (speed > this.maxSpeed) {
                this.vx = (this.vx / speed) * this.maxSpeed;
                this.vy = (this.vy / speed) * this.maxSpeed;
            }
            // 移動
            this.x += this.vx;
            this.y += this.vy;
            // 画面端での反射
            if (this.x < 0 || this.x > WORLD_SIZE) {
                this.vx *= -1;
                this.x = Math.max(0, Math.min(WORLD_SIZE, this.x));
            }
            if (this.y < 0 || this.y > WORLD_SIZE) {
                this.vy *= -1;
                this.y = Math.max(0, Math.min(WORLD_SIZE, this.y));
            }
            // 摩擦
            this.vx *= SIMULATION_SETTINGS.physics.friction;
            this.vy *= SIMULATION_SETTINGS.physics.friction;
            // 射撃カウンター更新
            this.weapons.forEach(w => w.fireCounter++);
        }
        draw() {
            // 大型船体（船種D）の場合
            if (this.hull.size > 12) {
                ctx.save();
                ctx.translate(this.x, this.y);
                // 90度回転を追加（横向き基準 → 縦向き）
                ctx.rotate(this.angle - Math.PI / 2);
                // 船体の色：射撃ユニットがあればグレー、なければ本来の色
                const hullColor = this.weapons.length > 0 ? 'rgba(136, 136, 136, 0.7)' : this.color;
                // カプセル型の船体（角丸長方形）
                let bodyWidth = this.hull.size * 0.38;
                let bodyHeight = this.hull.size * 1.35;
                if (this.engines.length === 0 && this.weapons.length === 0) {
                    // 破壊状態：正常時より小さく（但し現在よりは大きく）
                    bodyWidth *= 0.9;
                    bodyHeight *= 0.9;
                    ctx.strokeStyle = this.color;
                    ctx.lineWidth = 1;
                }
                else {
                    // 通常状態：塗りつぶしあり
                    ctx.fillStyle = hullColor;
                    ctx.beginPath();
                    const radius = bodyWidth / 2;
                    ctx.arc(0, -bodyHeight / 2 + radius, radius, Math.PI, 0, false);
                    ctx.lineTo(bodyWidth / 2, bodyHeight / 2 - radius);
                    ctx.arc(0, bodyHeight / 2 - radius, radius, 0, Math.PI, false);
                    ctx.lineTo(-bodyWidth / 2, -bodyHeight / 2 + radius);
                    ctx.closePath();
                    ctx.fill();
                    // 船体輪郭
                    ctx.strokeStyle = 'rgba(0, 0, 0, 0.3)';
                    ctx.lineWidth = 1.5;
                }
                const radius = bodyWidth / 2;
                ctx.beginPath();
                ctx.arc(0, -bodyHeight / 2 + radius, radius, Math.PI, 0, false);
                ctx.lineTo(bodyWidth / 2, bodyHeight / 2 - radius);
                ctx.arc(0, bodyHeight / 2 - radius, radius, 0, Math.PI, false);
                ctx.lineTo(-bodyWidth / 2, -bodyHeight / 2 + radius);
                ctx.closePath();
                ctx.stroke();
                // エンジンを後端に描画（小さい長方形）
                if (this.engines.length > 0) {
                    ctx.fillStyle = 'rgba(100, 100, 100, 0.7)';
                    ctx.fillRect(-6, bodyHeight / 2 + 6, 12, 6);
                    ctx.strokeStyle = 'rgba(60, 60, 60, 0.8)';
                    ctx.lineWidth = 1;
                    ctx.strokeRect(-6, bodyHeight / 2 + 6, 12, 6);
                }
                ctx.restore();
                // エンジン炎（グローバル座標系で船体後方に描画）
                if (this.thrustersActive && this.engines.length > 0 && Math.random() > 0.3) {
                    const flameSize = 10 + Math.random() * 6;
                    const flameX = this.x + Math.cos(this.angle + Math.PI) * (this.hull.size * 0.9);
                    const flameY = this.y + Math.sin(this.angle + Math.PI) * (this.hull.size * 0.9);
                    ctx.save();
                    ctx.translate(flameX, flameY);
                    ctx.rotate(this.angle + Math.PI);
                    ctx.fillStyle = 'rgba(255, 50, 0, 0.9)';
                    ctx.beginPath();
                    ctx.moveTo(0, -4);
                    ctx.lineTo(flameSize, 0);
                    ctx.lineTo(0, 4);
                    ctx.closePath();
                    ctx.fill();
                    ctx.restore();
                }
                // 独立砲塔を船体の上に描画
                this.weapons.forEach((weapon, index) => {
                    ctx.save();
                    ctx.translate(this.x, this.y);
                    const offsetY = this.getTurretOffsetY(index);
                    const rotatedAngle = this.angle - Math.PI / 2;
                    const rotatedX = Math.cos(rotatedAngle) * 0 - Math.sin(rotatedAngle) * offsetY;
                    const rotatedY = Math.sin(rotatedAngle) * 0 + Math.cos(rotatedAngle) * offsetY;
                    ctx.translate(rotatedX, rotatedY);
                    ctx.rotate(weapon.angle);
                    ctx.fillStyle = this.color;
                    ctx.beginPath();
                    ctx.moveTo(12, 0);
                    ctx.lineTo(-8.4, -7.2);
                    ctx.lineTo(-6, 0);
                    ctx.lineTo(-8.4, 7.2);
                    ctx.closePath();
                    ctx.fill();
                    ctx.strokeStyle = 'rgba(0, 0, 0, 0.3)';
                    ctx.lineWidth = 1;
                    ctx.stroke();
                    ctx.restore();
                });
            }
            else {
                // 標準船体（小型艦）
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);
                let scale = 1;
                if (this.engines.length === 0 && this.weapons.length === 0) {
                    // 破壊状態：塗りつぶしなし、線のみ、さらに小さい外枠
                    scale = 0.75;
                    ctx.strokeStyle = this.color;
                    ctx.lineWidth = 1;
                }
                else {
                    // 通常状態：塗りつぶしあり
                    ctx.fillStyle = this.color;
                    ctx.beginPath();
                    ctx.moveTo(this.hull.size, 0);
                    ctx.lineTo(-this.hull.size * 0.7, -this.hull.size * 0.6);
                    ctx.lineTo(-this.hull.size * 0.5, 0);
                    ctx.lineTo(-this.hull.size * 0.7, this.hull.size * 0.6);
                    ctx.closePath();
                    ctx.fill();
                }
                ctx.beginPath();
                ctx.moveTo(this.hull.size * scale, 0);
                ctx.lineTo(-this.hull.size * 0.7 * scale, -this.hull.size * 0.6 * scale);
                ctx.lineTo(-this.hull.size * 0.5 * scale, 0);
                ctx.lineTo(-this.hull.size * 0.7 * scale, this.hull.size * 0.6 * scale);
                ctx.closePath();
                // 破壊状態のみ縁取りを描画
                if (this.engines.length === 0 && this.weapons.length === 0) {
                    ctx.stroke();
                }
                // エンジン炎
                if (this.thrustersActive && this.engines.length > 0 && Math.random() > 0.3) {
                    ctx.fillStyle = 'rgba(255, 100, 0, 0.8)';
                    const flameLength = 10 + Math.random() * 10;
                    ctx.beginPath();
                    ctx.moveTo(-this.hull.size * 0.9 - flameLength, -5);
                    ctx.lineTo(-this.hull.size * 0.9 - flameLength, 5);
                    ctx.lineTo(-this.hull.size * 0.9, 0);
                    ctx.closePath();
                    ctx.fill();
                }
                ctx.restore();
            }
            // HPバー（ダメージ受け時のみ表示）
            if (this.hasBeenDamaged) {
                const hpBarWidth = 30;
                const hpBarHeight = 3;
                const hpBarSpacing = 5; // バー間のスペース
                const hpBarBaseY = this.y - this.getCollisionRadius() - 15;
                if (this.weapons.length > 0) {
                    // 射撃ユニットが存在する場合：各ユニットごとにHPバーを表示
                    this.weapons.forEach((weapon, index) => {
                        const hpBarX = this.x - hpBarWidth / 2;
                        const hpBarY = hpBarBaseY - (index * (hpBarHeight + hpBarSpacing));
                        ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
                        ctx.fillRect(hpBarX, hpBarY, hpBarWidth, hpBarHeight);
                        const hpRatio = weapon.hp / weapon.maxHp;
                        ctx.fillStyle = hpRatio > 0.3 ? '#0f0' : '#f00';
                        ctx.fillRect(hpBarX, hpBarY, hpBarWidth * hpRatio, hpBarHeight);
                        ctx.strokeStyle = TEAM_COLORS.A;
                        ctx.lineWidth = 1;
                        ctx.strokeRect(hpBarX, hpBarY, hpBarWidth, hpBarHeight);
                    });
                }
                else {
                    // 射撃ユニットが破壊された場合：船体HPを表示
                    const hpBarX = this.x - hpBarWidth / 2;
                    const hpBarY = hpBarBaseY;
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';

                ship.x += ship.vx;
                ship.y += ship.vy;
                // 画面端での反射
                if (ship.x < 0 || ship.x > WORLD_SIZE) {
                    ship.vx *= -1;
                    ship.x = Math.max(0, Math.min(WORLD_SIZE, ship.x));
                }
                if (ship.y < 0 || ship.y > WORLD_SIZE) {
                    ship.vy *= -1;
                    ship.y = Math.max(0, Math.min(WORLD_SIZE, ship.y));
                }
                // 目標なし（残骸含む）でも、見た目半径ぶんは最終的に画面内へ戻す
                const visualRadius = ship.getCollisionRadius();
                const settleStrength = SIMULATION_SETTINGS.physics.edgeRepulsionStrength;
                if (ship.x < visualRadius) {
                    const ratio = (visualRadius - ship.x) / Math.max(visualRadius, 1);
                    ship.vx += settleStrength * ratio;
                }
                else if (ship.x > WORLD_SIZE - visualRadius) {
                    const ratio = (ship.x - (WORLD_SIZE - visualRadius)) / Math.max(visualRadius, 1);
                    ship.vx -= settleStrength * ratio;
                }
                if (ship.y < visualRadius) {
                    const ratio = (visualRadius - ship.y) / Math.max(visualRadius, 1);
                    ship.vy += settleStrength * ratio;
                }
                else if (ship.y > WORLD_SIZE - visualRadius) {
                    const ratio = (ship.y - (WORLD_SIZE - visualRadius)) / Math.max(visualRadius, 1);
                    ship.vy -= settleStrength * ratio;
                }
                // 摩擦
                ship.vx *= SIMULATION_SETTINGS.physics.friction;
                ship.vy *= SIMULATION_SETTINGS.physics.friction;
            }
            if (target && ship.shouldFire()) {
                const bullet = ship.fire();
                if (bullet)
                    bullets.push(bullet);
            }
            ship.draw();
        });
    }
    // ========================================
    // メインループ
    // ========================================
    function animate() {
        // 追従モード時は毎フレームの艦船座標に合わせて表示位置を再計算
        recomputeRenderState();
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.imageSmoothingEnabled = false;
        // レターボックス背景
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        // world空間を描画する変換を適用
        ctx.setTransform(renderState.dpr * renderState.worldScale, 0, 0, renderState.dpr * renderState.worldScale, renderState.offsetX * renderState.dpr, renderState.offsetY * renderState.dpr);
        // world背景
        ctx.fillStyle = '#001a33';
        ctx.fillRect(0, 0, WORLD_SIZE, WORLD_SIZE);
        // 星
        stars.forEach(star => {
            ctx.fillStyle = `rgba(255, 255, 255, ${star.brightness})`;
            ctx.beginPath();
            ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
            ctx.fill();
        });
        // ビーコン更新と描画
        for (let i = detectionBeacons.length - 1; i >= 0; i--) {
            detectionBeacons[i].update();
            if (detectionBeacons[i].isAlive()) {
                detectionBeacons[i].draw();
            }
            else {
                detectionBeacons.splice(i, 1);
            }
        }
        // 統一されたチーム更新（チーム定義に基づく対称処理）
        for (const teamId of TEAM_IDS) {
            const opponents = TEAM_DEFINITIONS[teamId].enemies.flatMap((enemyTeamId) => teamShips[enemyTeamId]);
            updateTeam(teamShips[teamId], teamId, opponents);
        }
        // 衝突判定（相互作用）- すべての船と残骸に対して統一的に斥力を適用
        const allShips = TEAM_IDS.flatMap((teamId) => teamShips[teamId]);
        for (let i = 0; i < allShips.length; i++) {
            for (let j = i + 1; j < allShips.length; j++) {
                if (allShips[i].collidesWith(allShips[j])) {
                    const dx = allShips[i].x - allShips[j].x;
                    const dy = allShips[i].y - allShips[j].y;
                    const dist = Math.hypot(dx, dy);
                    if (dist > 0) {
                        const pushForce = 0.5;
                        // 相互に反対方向の斥力を与える
                        allShips[i].vx += (dx / dist) * pushForce;
                        allShips[i].vy += (dy / dist) * pushForce;
                        allShips[j].vx -= (dx / dist) * pushForce;
                        allShips[j].vy -= (dy / dist) * pushForce;
                    }
                }
            }
        }
        // 弾の対象チーム選定マップ（各チームの弾が何を攻撃できるか）
        const bulletTargetMap = {};
        for (const teamId of TEAM_IDS) {
            bulletTargetMap[TEAM_COLORS[teamId]] = TEAM_DEFINITIONS[teamId].enemies.map((enemyTeamId) => ({
                ships: teamShips[enemyTeamId],
                targetTeamId: enemyTeamId
            }));
        }
        // 弾更新
        for (let i = bullets.length - 1; i >= 0; i--) {
            bullets[i].update();
            if (bullets[i].isAlive()) {
                let bulletHit = false;
                const targets = bulletTargetMap[bullets[i].color];
                if (targets) {
                    for (let targetGroup of targets) {
                        if (bulletHit)
                            break;
                        const ships = targetGroup.ships;
                        const targetTeamId = targetGroup.targetTeamId;
                        for (let j = ships.length - 1; j >= 0; j--) {
                            if (bullets[i].collidesWith(ships[j])) {
                                const damageResult = ships[j].takeDamage(bullets[i].damage);
                                particles.push(...damageResult.particles);
                                // コスト更新
                                lostCostByTeam[targetTeamId] += damageResult.cost;
                                if (!ships[j].isAlive()) {
                                    particles.push(...ships[j].createExplosion());
                                    lostCostByTeam[targetTeamId] += ships[j].getCost();
                                    ships.splice(j, 1);
                                }
                                bulletHit = true;
                                break;
                            }
                        }
                    }
                }
                if (bulletHit) {
                    bullets.splice(i, 1);
                }
                else if (i >= 0 && i < bullets.length) {
                    bullets[i].draw();
                }
            }
            else {
                bullets.splice(i, 1);
            }
        }
        // パーティクル更新
        for (let i = particles.length - 1; i >= 0; i--) {
            particles[i].update();
            if (particles[i].isAlive()) {
                particles[i].draw();
            }
            else {
                particles.splice(i, 1);
            }
        }
        // 情報表示：コスト情報
        const currentCostByTeam = {};
        for (const teamId of TEAM_IDS) {
            currentCostByTeam[teamId] = initialCostByTeam[teamId] - lostCostByTeam[teamId];
        }
        // 破壊されたシップ（射撃ユニットなし）は除外
        const currentShipCountByTeam = {};
        for (const teamId of TEAM_IDS) {
            currentShipCountByTeam[teamId] = teamShips[teamId].filter((ship) => ship.weapons.length > 0).length;
        }
        infoDiv.innerHTML = TEAM_IDS.map((teamId) => {
            const currentShipCount = currentShipCountByTeam[teamId];
            const initialShipCount = initialShipCountByTeam[teamId];
            const currentCost = currentCostByTeam[teamId];
            const initialCost = initialCostByTeam[teamId];
            return `<strong>${formatTeamLabel(teamId)}</strong><br>
    船体 ${currentShipCount}/${initialShipCount}${currentShipCount === 0 ? ' 全滅' : ''}<br>
    コスト ${currentCost}/${initialCost}`;
        }).join('<br><br>');
        requestAnimationFrame(animate);
    }
    animate();
        </script>
