<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Starship Simulation v2 - Modular Design</title>
    <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
                user-select: none;
                -webkit-user-select: none;
                -webkit-touch-callout: none;
            }
            body {
                background: #000;
                font-family: 'Courier New', monospace;
                overflow: hidden;
                width: 100%;
                height: 100%;
                position: fixed;
            }
            canvas {
                display: block;
                background: #001a33;
                width: 100%;
                height: 100%;
                touch-action: none;
            }
            #info {
                position: absolute;
                bottom: 10px;
                left: 10px;
                color: #0f0;
                font-size: 11px;
                line-height: 1.4;
                background: rgba(0, 0, 0, 0.8);
                padding: 10px;
                border: 1px solid #0f0;
                z-index: 10;
                max-width: 200px;
            }
            #test-buttons {
                position: absolute;
                top: 10px;
                right: 10px;
                display: flex;
                flex-direction: column;
                gap: 8px;
                z-index: 10;
            }
            .test-btn {
                padding: 8px 12px;
                background: rgba(0, 50, 100, 0.7);
                color: #0f0;
                border: 1px solid #0f0;
                cursor: pointer;
                font-size: 11px;
                font-family: 'Courier New', monospace;
                transition: all 0.2s;
            }
            .test-btn:hover {
                background: rgba(0, 100, 150, 0.9);
                box-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
            }
            #wreckage-toggle {
                position: absolute;
                bottom: 10px;
                right: 10px;
                padding: 8px 12px;
                background: rgba(0, 50, 100, 0.7);
                color: #0f0;
                border: 1px solid #0f0;
                cursor: pointer;
                font-size: 11px;
                font-family: 'Courier New', monospace;
                transition: all 0.2s;
                z-index: 10;
            }
            #wreckage-toggle:hover {
                background: rgba(0, 100, 150, 0.9);
                box-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
            }
            #wreckage-toggle.active {
                background: rgba(200, 100, 0, 0.8);
                border: 1px solid rgba(255, 200, 0, 0.8);
                color: rgba(255, 200, 0, 0.9);
                box-shadow: 0 0 10px rgba(255, 150, 0, 0.6);
            }
            #beacon-button {
                position: absolute;
                bottom: 50px;
                right: 10px;
                padding: 8px 12px;
                background: rgba(0, 50, 100, 0.7);
                color: #0f0;
                border: 1px solid #0f0;
                cursor: pointer;
                font-size: 11px;
                font-family: 'Courier New', monospace;
                transition: all 0.2s;
                z-index: 10;
            }
            #beacon-button:hover {
                background: rgba(0, 100, 150, 0.9);
                box-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
            }
            #beacon-button.active {
                background: rgba(100, 200, 255, 0.8);
                border: 2px solid rgba(153, 221, 255, 0.9);
                color: rgba(153, 221, 255, 1);
                box-shadow: 0 0 10px rgba(153, 221, 255, 0.6);
            }
        </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <!-- 左下：情報パネル（チームA：水色の情報表示） -->
    <div id="info"></div>
    <div id="test-buttons">
        <button class="test-btn" data-config="mixed1c8vsmixed1c8">L1D2C8</button>
        <button class="test-btn" data-config="corvette8vsdestroyer2">C8vsD2</button>
        <button class="test-btn" data-config="lightcruiser1vsdestroyer2">L1vsD2</button>
        <button class="test-btn" data-config="mass_d1c8">Mass D1C8</button>
        <button class="test-btn" data-config="threeway_l1d4c32">L1D4C16</button>
    </div>
    <!-- 右下：ビーコン配置ボタン -->
    <button id="beacon-button">ビーコン: チームA</button>
    <!-- 右下：残骸攻撃トグルボタン -->
    <button id="wreckage-toggle">残骸を無視する</button>

    <script>
    // @ts-nocheck
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const infoDiv = document.getElementById('info');
    function resizeCanvas() {
        const dpr = window.devicePixelRatio || 1;
        canvas.width = window.innerWidth * dpr;
        canvas.height = window.innerHeight * dpr;
        ctx.scale(dpr, dpr);
    }
    resizeCanvas();
    // ========================================
    // イベントハンドラ
    // ========================================
    function handleMove(e) {
        const rect = canvas.getBoundingClientRect();
        if (e.touches) {
            mouseX = e.touches[0].clientX - rect.left;
            mouseY = e.touches[0].clientY - rect.top;
        }
        else {
            mouseX = e.clientX - rect.left;
            mouseY = e.clientY - rect.top;
        }
    }
    document.addEventListener('mousemove', handleMove);
    document.addEventListener('touchmove', (e) => {
        e.preventDefault();
        handleMove(e);
    }, { passive: false });
    // テストボタンのイベントハンドラ
    document.querySelectorAll('.test-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            const config = btn.dataset.config;
            initializeGame(config);
        });
    });
    // 残骸攻撃トグルボタンのイベントハンドラ
    document.getElementById('wreckage-toggle').addEventListener('click', () => {
        attackWrecks = !attackWrecks;
        const toggle = document.getElementById('wreckage-toggle');
        if (attackWrecks) {
            toggle.classList.add('active');
            toggle.textContent = '残骸を攻撃する';
        }
        else {
            toggle.classList.remove('active');
            toggle.textContent = '残骸を無視する';
        }
    });
    // ビーコンボタンのイベントハンドラ
    const beaconButton = document.getElementById('beacon-button');
    const teamCycle = ['A', 'B', 'C'];
    beaconButton.addEventListener('click', () => {
        const currentIndex = teamCycle.indexOf(selectedBeaconTeam);
        selectedBeaconTeam = teamCycle[(currentIndex + 1) % teamCycle.length];
        beaconButton.textContent = `ビーコン: チーム${selectedBeaconTeam}`;
        beaconButton.classList.add('active');
    });
    // キャンバスクリックでビーコン配置
    canvas.addEventListener('click', (e) => {
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        // ビーコンを配置
        detectionBeacons.push(new DetectionBeacon(x, y, selectedBeaconTeam));
    });
    document.addEventListener('contextmenu', (e) => e.preventDefault());
    
    // @ts-nocheck
    // ========================================
    // コンポーネント定義
    // ========================================
    // 標準船体（Standard Hull）
    class Hull {
        constructor() {
            this.mass = 1;
            this.hp = 100;
            this.maxHp = 100;
            this.size = 12;
        }
        getCost() {
            return this.mass;
        }
    }
    // 大型船体（Large Hull）
    class LargeHull {
        constructor() {
            this.mass = 3;
            this.hp = 300;
            this.maxHp = 300;
            this.size = 28;
        }
        getCost() {
            return this.mass;
        }
    }
    // 船体5（Light Cruiser Hull）
    class Hull5 {
        constructor() {
            this.mass = 5;
            this.hp = 500;
            this.maxHp = 500;
            this.size = 47;
        }
        getCost() {
            return this.mass;
        }
    }
    // 標準推進エンジン（Standard Thruster）
    class ThrusterEngine {
        constructor() {
            this.mass = 1;
            this.thrust = 0.15; // 推進力
            this.rotationSpeed = 0.1; // 旋回速度（2倍速）
        }
        getCost() {
            return this.mass;
        }
    }
    // 高性能レーダー（Advanced Radar）
    // レーダーA（Radar A）
    class RadarA {
        constructor() {
            this.mass = 1;
            this.detectionBonus = 30; // 索敵範囲ボーナス（ピクセル）
        }
        getCost() {
            return this.mass;
        }
    }
    // レーダーB（Radar B）
    class RadarB {
        constructor() {
            this.mass = 2;
            this.detectionBonus = 45; // 索敵範囲ボーナス（ピクセル）
        }
        getCost() {
            return this.mass;
        }
    }
    // 標準射撃ユニット（Standard Weapon System）
    class WeaponUnit {
        constructor() {
            this.mass = 1;
            this.hp = 150;
            this.maxHp = 150;
            this.fireInterval = 60;
            this.fireCounter = 0;
            this.fireAngle = Math.PI / 12; // 前方15度
            this.detectionRange = 150;
            this.bulletSpeed = 5;
            this.bulletDamage = 10;
            this.maxRange = 225; // 索敇範囲の1.5倍
            this.rotationSpeed = 0.1; // 砲塔の旋回速度（2倍速）
            this.angle = 0; // 砲塔独自の角度
            this.targetX = 0; // 砲塔独自の目標X
            this.targetY = 0; // 砲塔独自の目標Y
        }
        // 砲塔を目標に向けて旋回（偏差撃ちに対応）
        updateAngle(targetX, targetY, currentX, currentY, targetVx = 0, targetVy = 0) {
            // 現在の距離を計算
            const dx = targetX - currentX;
            const dy = targetY - currentY;
            const distance = Math.hypot(dx, dy);
            // 弾の飛行時間を計算
            const flightTime = distance / this.bulletSpeed;
            // 目標の予測位置を計算（偏差撃ち）
            const predictedX = targetX + targetVx * flightTime;
            const predictedY = targetY + targetVy * flightTime;
            // 予測位置に向けての角度を計算
            const predDx = predictedX - currentX;
            const predDy = predictedY - currentY;
            const targetAngle = Math.atan2(predDy, predDx);
            let angleDiff = targetAngle - this.angle;
            if (angleDiff > Math.PI)
                angleDiff -= 2 * Math.PI;
            if (angleDiff < -Math.PI)
                angleDiff += 2 * Math.PI;
            this.angle += angleDiff * this.rotationSpeed;
        }
        canFire(targetX, targetY, shipX, shipY) {
            // 索敵範囲チェックのみ（敵がいれば角度関係なく射撃）
            const dx = targetX - shipX;
            const dy = targetY - shipY;
            const distance = Math.hypot(dx, dy);
            return distance <= this.detectionRange;
        }
        fire(x, y) {
            const bulletVx = Math.cos(this.angle) * this.bulletSpeed;
            const bulletVy = Math.sin(this.angle) * this.bulletSpeed;
            const fireX = x + Math.cos(this.angle) * 12;
            const fireY = y + Math.sin(this.angle) * 12;
            return new Bullet(fireX, fireY, bulletVx, bulletVy, x, y, this.bulletDamage, this.maxRange);
        }
        getCost() {
            return this.mass;
        }
    }
    // 独立砲塔射撃ユニットB（Independent Turret Weapon System B）
    class IndependentTurretB extends WeaponUnit {
        constructor() {
            super();
            this.mass = 4;
            this.hp = 200;
            this.maxHp = 200;
            this.fireInterval = 90;
            this.detectionRange = 225; // 船種C150の1.5倍
            this.maxRange = 338; // 索敵範囲の1.5倍
            this.bulletDamage = 20;
        }
    }
    
    // @ts-nocheck
    // ========================================
    // 弾丸クラス
    // ========================================
    class Bullet {
        constructor(x, y, vx, vy, originX, originY, damage, maxRange, color = '#99ddff') {
            this.x = x;
            this.y = y;
            this.vx = vx;
            this.vy = vy;
            this.originX = originX;
            this.originY = originY;
            this.damage = damage;
            this.maxRange = maxRange;
            this.color = color;
            this.life = 300;
            this.size = 3;
        }
        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.life--;
            const canvasWidth = canvas.width / window.devicePixelRatio;
            const canvasHeight = canvas.height / window.devicePixelRatio;
            if (this.x < -50 || this.x > canvasWidth + 50 ||
                this.y < -50 || this.y > canvasHeight + 50) {
                this.life = 0;
            }
            const dx = this.x - this.originX;
            const dy = this.y - this.originY;
            const distance = Math.hypot(dx, dy);
            if (distance > this.maxRange) {
                this.life = 0;
            }
        }
        draw() {
            ctx.fillStyle = this.color;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
        }
        isAlive() {
            return this.life > 0;
        }
        collidesWith(ship) {
            const dx = this.x - ship.x;
            const dy = this.y - ship.y;
            const distance = Math.hypot(dx, dy);
            return distance < this.size + ship.getCollisionRadius();
        }
    }
    // ========================================
    // パーティクルクラス
    // ========================================
    class Particle {
        constructor(x, y, vx, vy, color, size = 3) {
            this.x = x;
            this.y = y;
            this.vx = vx;
            this.vy = vy;
            this.color = color;
            this.size = size;
            this.life = 30;
            this.maxLife = 30;
        }
        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.vy += 0.05; // 重力
            this.life--;
        }
        draw() {
            const alpha = this.life / this.maxLife;
            ctx.fillStyle = this.color.replace(')', `, ${alpha})`).replace('rgb', 'rgba');
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
        }
        isAlive() {
            return this.life > 0;
        }
    }
    // ========================================
    // 検出ビーコンクラス
    // ========================================
    class DetectionBeacon {
        constructor(x, y, teamId, range = 150, duration = 180) {
            this.x = x;
            this.y = y;
            this.teamId = teamId;
            this.range = range; // 検出範囲（150px、船種C相当）
            this.life = duration; // フレーム数（約3秒）
            this.maxLife = duration;
        }
        contains(ship) {
            const dx = ship.x - this.x;
            const dy = ship.y - this.y;
            const distance = Math.hypot(dx, dy);
            return distance < this.range;
        }
        update() {
            this.life--;
            return this.life > 0;
        }
        draw() {
            const alpha = this.life / this.maxLife;
            const color = teamMetadata[this.teamId].color;
            // 16進数カラーをrgbaに変換
            const r = parseInt(color.substr(1, 2), 16);
            const g = parseInt(color.substr(3, 2), 16);
            const b = parseInt(color.substr(5, 2), 16);
            ctx.strokeStyle = `rgba(${r}, ${g}, ${b}, ${alpha * 0.5})`;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.range, 0, Math.PI * 2);
            ctx.stroke();
            // 中心マーク
            ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${alpha * 0.7})`;
            ctx.beginPath();
            ctx.arc(this.x, this.y, 4, 0, Math.PI * 2);
            ctx.fill();
        }
        isAlive() {
            return this.life > 0;
        }
    }
    
    // @ts-nocheck
    // ========================================
    // 艦船クラス（モジュラー構成）
    // ========================================
    class Starship {
        constructor(x, y, weaponCount, engineCount, color = '#99ddff', hullType = 'standard', weaponClass = WeaponUnit) {
            this.x = x;
            this.y = y;
            this.vx = 0;
            this.vy = 0;
            this.angle = 0;
            this.color = color;
            this.targetX = x;
            this.targetY = y;
            this.targetVx = 0; // 目標の速度X（偏差撃ち用）
            this.targetVy = 0; // 目標の速度Y（偏差撃ち用）
            this.maxSpeed = 2;
            // 初期状態ではスラスターOFF（索敇範囲内に入ったらON）
            this.thrustersActive = false;
            // 相手を検出しているか（索敇範囲内にいるか）
            this.detectedTarget = false;
            // コンポーネント構成
            if (hullType === 'hull5') {
                this.hull = new Hull5();
            }
            else if (hullType === 'large') {
                this.hull = new LargeHull();
            }
            else {
                this.hull = new Hull();
            }
            this.weapons = [];
            this.engines = [];
            this.radar = null;
            this.radarCount = 0;
            for (let i = 0; i < weaponCount; i++) {
                this.weapons.push(new weaponClass());
            }
            for (let i = 0; i < engineCount; i++) {
                this.engines.push(new ThrusterEngine());
            }
            // 大型船体にはレーダーAを搭載
            if (hullType === 'large') {
                this.radar = new RadarA();
                this.radarCount = 1;
            }
            else if (hullType === 'hull5') {
                this.radar = new RadarB();
                this.radarCount = 1;
            }
            // 射撃ユニット数の上限チェック
            if (this.engines.length > this.weapons.length) {
                this.engines = this.engines.slice(0, this.weapons.length);
            }
            this.hullExposed = false; // 船体HPが露出しているか
            this.hasBeenDamaged = false; // ダメージを受けたかどうか
        }
        getTurretOffsetY(index) {
            const count = this.weapons.length;
            if (count <= 1)
                return 0;
            if (count === 2) {
                return index === 0 ? -this.hull.size * 0.6 : this.hull.size * 0.6;
            }
            if (index === 0)
                return -this.hull.size * 0.6;
            if (index === 1)
                return 0;
            return this.hull.size * 0.6;
        }
        // 総質量を計算
        getTotalMass() {
            let mass = this.hull.mass;
            mass += this.weapons.reduce((sum, w) => sum + w.mass, 0);
            mass += this.engines.reduce((sum, e) => sum + e.mass, 0);
            if (this.radar)
                mass += this.radar.mass * this.radarCount;
            return mass;
        }
        // 船体見た目に寄せた当たり判定半径
        getCollisionRadius() {
            if (this.hull.size === 47)
                return 31; // Hull5
            if (this.hull.size === 28)
                return 20; // LargeHull
            return 11; // Standard Hull
        }
        // コストを計算（重量と一致）
        getCost() {
            return this.getTotalMass();
        }
        // 総推進力を計算
        getTotalThrust() {
            return this.engines.reduce((sum, e) => sum + e.thrust, 0);
        }
        // 総旋回速度を計算（質量で割る）
        getTotalRotationSpeed() {
            const totalRotationForce = this.engines.reduce((sum, e) => sum + e.rotationSpeed, 0);
            const totalMass = this.getTotalMass();
            return totalRotationForce / totalMass;
        }
        // 総HPを計算（表示用）
        getTotalHP() {
            if (this.weapons.length === 0) {
                return this.hull.hp;
            }
            return this.weapons.reduce((sum, w) => sum + w.hp, 0);
        }
        getMaxHP() {
            if (this.weapons.length === 0) {
                return this.hull.maxHp;
            }
            return this.weapons.reduce((sum, w) => sum + w.maxHp, 0);
        }
        update(targetX, targetY, skipDetectionCheck = false) {
            const canvasWidth = canvas.width / window.devicePixelRatio;
            const canvasHeight = canvas.height / window.devicePixelRatio;
            // 認識距離チェック（目標が指定された場合）
            if (this.weapons.length > 0 && !skipDetectionCheck) {
                const dx = targetX - this.x;
                const dy = targetY - this.y;
                const distanceToTarget = Math.hypot(dx, dy);
                // 索敵範囲内なら目標を設定
                if (distanceToTarget < this.weapons[0].detectionRange) {
                    // 索敇範囲内に入ったらスラスターONと検出フラグをON
                    this.thrustersActive = true;
                    this.detectedTarget = true;
                    this.targetX = targetX;
                    this.targetY = targetY;
                    const centerX = canvasWidth / 2;
                    const centerY = canvasHeight / 2;
                    const margin = 100;
                    const correction = 0.6;
                    if (this.x < margin)
                        this.targetX += (centerX - this.targetX) * correction;
                    else if (this.x > canvasWidth - margin)
                        this.targetX += (centerX - this.targetX) * correction;
                    if (this.y < margin)
                        this.targetY += (centerY - this.targetY) * correction;
                    else if (this.y > canvasHeight - margin)
                        this.targetY += (centerY - this.targetY) * correction;
                }
                else {
                    // 索敇範囲外：移動しない、検出フラグもOFF
                    this.thrustersActive = false;
                    this.detectedTarget = false;
                    this.targetX = this.x;
                    this.targetY = this.y;
                }
            }
            else if (this.weapons.length > 0 && skipDetectionCheck) {
                // skipDetectionCheck=true の場合：検出距離制限をバイパス（チームAがマウス追従時に使用）
                this.targetX = targetX;
                this.targetY = targetY;
                // thrustersActive と detectedTarget は呼び出し元で既に設定済み
            }
            else {
                this.targetX = targetX;
                this.targetY = targetY;
            }
            // 砲塔を目標に向けて旋回（大型船体の場合のみ独立砲塔）
            if (this.hull.size > 12) {
                this.weapons.forEach((weapon, index) => {
                    // 砲塔の実際の位置を計算
                    const offsetY = this.getTurretOffsetY(index);
                    const rotatedAngle = this.angle - Math.PI / 2;
                    const rotatedX = Math.cos(rotatedAngle) * 0 - Math.sin(rotatedAngle) * offsetY;
                    const rotatedY = Math.sin(rotatedAngle) * 0 + Math.cos(rotatedAngle) * offsetY;
                    const weaponX = this.x + rotatedX;
                    const weaponY = this.y + rotatedY;
                    // 砲塔の位置から共通の目標への角度を計算（偏差撃ち対応）
                    // 敵が索敇範囲外の場合、this.targetは自身の位置のため砲塔は旋回しない
                    weapon.updateAngle(this.targetX, this.targetY, weaponX, weaponY, this.targetVx, this.targetVy);
                });
            }
            else {
                // 標準船体の場合、射撃ユニットの角度を船体の角度に同期
                this.weapons.forEach(weapon => {
                    weapon.angle = this.angle;
                });
            }
            // 船体の旋回
            if (this.engines.length > 0) {
                let targetAngle;
                // 標準船体の場合、偏差撃ちを考慮
                if (this.hull.size <= 12 && this.weapons.length > 0) {
                    const dx = this.targetX - this.x;
                    const dy = this.targetY - this.y;
                    const distance = Math.hypot(dx, dy);
                    // 弾の飛行時間を計算
                    const bulletSpeed = this.weapons[0].bulletSpeed;
                    const flightTime = distance / bulletSpeed;
                    // 目標の予測位置を計算（偏差撃ち）
                    const predictedX = this.targetX + this.targetVx * flightTime;
                    const predictedY = this.targetY + this.targetVy * flightTime;
                    // 予測位置に向けての角度を計算
                    const predDx = predictedX - this.x;
                    const predDy = predictedY - this.y;
                    targetAngle = Math.atan2(predDy, predDx);
                }
                else {
                    // 大型船体の場合、単純に目標方向に向く
                    const dx = this.targetX - this.x;
                    const dy = this.targetY - this.y;
                    targetAngle = Math.atan2(dy, dx);
                }
                let angleDiff = targetAngle - this.angle;
                if (angleDiff > Math.PI)
                    angleDiff -= 2 * Math.PI;
                if (angleDiff < -Math.PI)
                    angleDiff += 2 * Math.PI;
                const rotSpeed = this.getTotalRotationSpeed();
                this.angle += angleDiff * rotSpeed;
            }
            // 推進
            if (this.thrustersActive && this.engines.length > 0) {
                const dx = this.targetX - this.x;
                const dy = this.targetY - this.y;
                const targetAngle = Math.atan2(dy, dx);
                let angleDiff = targetAngle - this.angle;
                if (angleDiff > Math.PI)
                    angleDiff -= 2 * Math.PI;
                if (angleDiff < -Math.PI)
                    angleDiff += 2 * Math.PI;
                const thrustFactor = Math.max(0, Math.cos(angleDiff));
                const totalThrust = this.getTotalThrust();
                const totalMass = this.getTotalMass();
                const acceleration = totalThrust / totalMass;
                this.vx += Math.cos(this.angle) * acceleration * thrustFactor;
                this.vy += Math.sin(this.angle) * acceleration * thrustFactor;
            }
            // 画面端の斥力
            const margin = 80;
            const maxRepelStrength = 0.05;
            if (this.x < margin) {
                const distRatio = 1 - (this.x / margin);
                this.vx += maxRepelStrength * distRatio;
            }
            if (this.x > canvasWidth - margin) {
                const distRatio = 1 - ((canvasWidth - this.x) / margin);
                this.vx -= maxRepelStrength * distRatio;
            }
            if (this.y < margin) {
                const distRatio = 1 - (this.y / margin);
                this.vy += maxRepelStrength * distRatio;
            }
            if (this.y > canvasHeight - margin) {
                const distRatio = 1 - ((canvasHeight - this.y) / margin);
                this.vy -= maxRepelStrength * distRatio;
            }
            // 最高速度制限
            const speed = Math.hypot(this.vx, this.vy);
            if (speed > this.maxSpeed) {
                this.vx = (this.vx / speed) * this.maxSpeed;
                this.vy = (this.vy / speed) * this.maxSpeed;
            }
            // 移動
            this.x += this.vx;
            this.y += this.vy;
            // 画面端での反射
            if (this.x < 0 || this.x > canvasWidth) {
                this.vx *= -1;
                this.x = Math.max(0, Math.min(canvasWidth, this.x));
            }
            if (this.y < 0 || this.y > canvasHeight) {
                this.vy *= -1;
                this.y = Math.max(0, Math.min(canvasHeight, this.y));
            }
            // 摩擦
            this.vx *= 0.98;
            this.vy *= 0.98;
            // 射撃カウンター更新
            this.weapons.forEach(w => w.fireCounter++);
        }

                ctx.beginPath();
                ctx.moveTo(this.hull.size * scale, 0);
                ctx.lineTo(-this.hull.size * 0.7 * scale, -this.hull.size * 0.6 * scale);
                ctx.lineTo(-this.hull.size * 0.5 * scale, 0);
                ctx.lineTo(-this.hull.size * 0.7 * scale, this.hull.size * 0.6 * scale);
                ctx.closePath();
                // 破壊状態のみ縁取りを描画
                if (this.engines.length === 0 && this.weapons.length === 0) {
                    ctx.stroke();
                }
                // エンジン炎
                if (this.thrustersActive && this.engines.length > 0 && Math.random() > 0.3) {

                    ctx.moveTo(-this.hull.size * 0.9 - flameLength, -5);

                }
                ctx.restore();

            // HPバー（ダメージ受け時のみ表示）
            if (this.hasBeenDamaged) {

                const hpBarBaseY = this.y - this.getCollisionRadius() - 15;
                if (this.weapons.length > 0) {
                    // 射撃ユニットが存在する場合：各ユニットごとにHPバーを表示
                    this.weapons.forEach((weapon, index) => {
                        const hpBarX = this.x - hpBarWidth / 2;
                        const hpBarY = hpBarBaseY - (index * (hpBarHeight + hpBarSpacing));

                else {

                    ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
                    ctx.fillRect(hpBarX, hpBarY, hpBarWidth, hpBarHeight);
                    const hpRatio = this.hull.hp / this.hull.maxHp;
                    ctx.fillStyle = '#888888';
                    ctx.fillRect(hpBarX, hpBarY, hpBarWidth * hpRatio, hpBarHeight);

                    ctx.lineWidth = 1;
                    ctx.strokeRect(hpBarX, hpBarY, hpBarWidth, hpBarHeight);
                }

            // 索敵範囲
            if (this.weapons.length > 0) {

            // 残骸円（常に表示）
            if (this.engines.length === 0 && this.isAlive()) {

                ctx.lineWidth = 2;
                ctx.setLineDash([5, 5]);
                ctx.beginPath();

                const wreckageRadius = this.getCollisionRadius();
                ctx.arc(this.x, this.y, wreckageRadius, 0, Math.PI * 2);

        shouldFire() {
            if (this.weapons.length === 0)
                return false;
            // 目標を検出していない場合は射撃しない
            if (!this.detectedTarget)
                return false;
            this.nextFireWeaponIndex = -1;
            for (let i = 0; i < this.weapons.length; i++) {
                const weapon = this.weapons[i];
                if (weapon.fireCounter >= weapon.fireInterval) {
                    // 大型船体の場合、砲塔の実際の位置を基準にcanFire判定
                    let weaponX = this.x;
                    let weaponY = this.y;
                    if (this.hull.size > 12) {
                        const offsetY = this.getTurretOffsetY(i);
                        const rotatedAngle = this.angle - Math.PI / 2;
                        const rotatedX = Math.cos(rotatedAngle) * 0 - Math.sin(rotatedAngle) * offsetY;
                        const rotatedY = Math.sin(rotatedAngle) * 0 + Math.cos(rotatedAngle) * offsetY;
                        weaponX += rotatedX;
                        weaponY += rotatedY;
                    }
                    // 全ての砲塔が共通の目標を使用
                    if (weapon.canFire(this.targetX, this.targetY, weaponX, weaponY)) {
                        weapon.fireCounter = 0;
                        this.nextFireWeaponIndex = i;
                        return true;
                    }
                }
            }
            return false;
        }
        fire() {
            if (this.weapons.length === 0 || this.nextFireWeaponIndex < 0)
                return null;
            const weapon = this.weapons[this.nextFireWeaponIndex];
            let fireFromX = this.x;
            let fireFromY = this.y;
            // 大型船体の場合、砲塔の位置から発射
            if (this.hull.size > 12) {
                const offsetY = this.getTurretOffsetY(this.nextFireWeaponIndex);
                const rotatedAngle = this.angle - Math.PI / 2;
                const rotatedX = Math.cos(rotatedAngle) * 0 - Math.sin(rotatedAngle) * offsetY;
                const rotatedY = Math.sin(rotatedAngle) * 0 + Math.cos(rotatedAngle) * offsetY;
                fireFromX += rotatedX;
                fireFromY += rotatedY;
            }
            const bullet = weapon.fire(fireFromX, fireFromY);
            // 弾の色を船の色から設定（チームA/B/C対応）
            bullet.color = this.color;
            return bullet;
        }
        takeDamage(amount) {
            this.hasBeenDamaged = true;
            let destroyedCost = 0;
            let particles = [];
            if (this.weapons.length > 0) {
                // 射撃ユニットにダメージ
                const weapon = this.weapons[0];
                weapon.hp -= amount;
                if (weapon.hp <= 0) {
                    // 射撃ユニット破壊 - コストを記録
                    destroyedCost += weapon.getCost();
                    this.weapons.shift();
                    // エンジン数が射撃ユニット数を超えたらエンジン喪失 - コストを記録
                    while (this.engines.length > this.weapons.length) {
                        const engine = this.engines.pop();
                        destroyedCost += engine.getCost();
                    }
                    // 残骸状態に遷移した場合、HPバーを表示するため hasBeenDamaged を確実に true に設定
                    if (this.weapons.length === 0) {
                        this.hasBeenDamaged = true;
                    }
                    particles = this.createSmallExplosion();
                }
            }
            else {
                // 船体にダメージ
                this.hull.hp -= amount;
            }
            return { particles, cost: destroyedCost };
        }
        isAlive() {
            if (this.weapons.length > 0)
                return true;
            return this.hull.hp > 0;

        collidesWith(otherShip) {
            const dx = this.x - otherShip.x;
            const dy = this.y - otherShip.y;
            const distance = Math.hypot(dx, dy);
            return distance < this.getCollisionRadius() + otherShip.getCollisionRadius();

        createExplosion() {
            const explosionParticles = [];
            const particleCount = 15;
            const colors = ['rgb(255, 100, 0)', 'rgb(255, 200, 0)', 'rgb(255, 150, 0)', 'rgb(200, 100, 0)'];
            for (let i = 0; i < particleCount; i++) {
                const angle = (i / particleCount) * Math.PI * 2;
                const speed = 2 + Math.random() * 3;
                const vx = Math.cos(angle) * speed;
                const vy = Math.sin(angle) * speed;
                const color = colors[Math.floor(Math.random() * colors.length)];
                const size = 3 + Math.random() * 4;
                explosionParticles.push(new Particle(this.x, this.y, vx, vy, color, size));
            }
            return explosionParticles;
        }
        createSmallExplosion() {
            const explosionParticles = [];
            const particleCount = 8;
            const colors = ['rgb(255, 100, 0)', 'rgb(255, 200, 0)'];
            for (let i = 0; i < particleCount; i++) {
                const angle = (i / particleCount) * Math.PI * 2;
                const speed = 1 + Math.random() * 2;
                const vx = Math.cos(angle) * speed;
                const vy = Math.sin(angle) * speed;
                const color = colors[Math.floor(Math.random() * colors.length)];

                explosionParticles.push(new Particle(this.x, this.y, vx, vy, color, size));

        selectTarget(opponents, attackWrecks) {
            let closestActive = null;
            let closestActiveDistance = Infinity;
            let closestDebris = null;
            let closestDebrisDistance = Infinity;
            if (this.weapons.length > 0) {
                opponents.forEach(opponent => {
                    const isWreck = opponent.weapons.length === 0;
                    const dx = opponent.x - this.x;
                    const dy = opponent.y - this.y;
                    const distance = Math.hypot(dx, dy);
                    if (distance < this.weapons[0].detectionRange) {
                        if (isWreck) {
                            // 残骸：attackWrecks 設定に従う
                            if (attackWrecks && distance < closestDebrisDistance) {
                                closestDebris = opponent;
                                closestDebrisDistance = distance;
                            }
                        }
                        else {
                            // 通常状態：最も近い相手を記録
                            if (distance < closestActiveDistance) {
                                closestActive = opponent;
                                closestActiveDistance = distance;
                            }
                        }
                    }
                });
            }
            // 優先順位：通常状態 > 残骸
            return closestActive || (closestDebris && attackWrecks ? closestDebris : null);
        }

    // @ts-nocheck
    // ========================================
    // ビーコン検出ロジック
    // ========================================
    function isShipInFriendlyBeacon(ship, teamId) {
        // 船がこのチームのビーコン内にいるかチェック
        for (let beacon of detectionBeacons) {
            if (beacon.teamId === teamId && beacon.contains(ship)) {
                return true;
            }
        }
        return false;
    }
    function getBeaconDetectedEnemies(teamId, opponents) {
        // このチームのビーコン内に敵がいるかチェック
        const detected = [];
        for (let beacon of detectionBeacons) {
            if (beacon.teamId !== teamId)
                continue;
            for (let opponent of opponents) {
                const isWreck = opponent.weapons.length === 0;
                if (isWreck && !attackWrecks)
                    continue;
                if (beacon.contains(opponent))
                    detected.push(opponent);
            }
        }
        return detected;
    }
    // ========================================
    // 統一されたチーム更新関数
    // ========================================
    function updateTeam(ships, teamId, opponents) {
        const isControlledByMouse = teamId === mouseControlTeam;
        const metadata = teamMetadata[teamId];
        const enemyShips = opponents.filter(opponent => opponent.color !== metadata.color);
        const beaconDetectedEnemies = getBeaconDetectedEnemies(teamId, enemyShips);
        const enemyInBeacon = beaconDetectedEnemies.length > 0;
        ships.forEach((ship, index) => {
            let target = null;
            let isBeaconTarget = false;
            if (ship.weapons.length > 0) {
                const normalTarget = ship.selectTarget(enemyShips, attackWrecks);
                let beaconTarget = null;
                let beaconClosestDistance = Infinity;
                if (enemyInBeacon) {
                    // ビーコン内に敵がいる場合：ビーコン検出範囲も索敵候補に追加
                    for (let opponent of beaconDetectedEnemies) {
                        const dx = opponent.x - ship.x;
                        const dy = opponent.y - ship.y;
                        const distance = Math.hypot(dx, dy);
                        if (distance < beaconClosestDistance) {
                            beaconClosestDistance = distance;
                            beaconTarget = opponent;
                        }
                    }
                }
                if (normalTarget && beaconTarget) {
                    const dx = normalTarget.x - ship.x;
                    const dy = normalTarget.y - ship.y;
                    const normalDistance = Math.hypot(dx, dy);
                    if (normalDistance <= beaconClosestDistance) {
                        target = normalTarget;
                    }
                    else {
                        target = beaconTarget;
                        isBeaconTarget = true;
                    }
                }
                else if (normalTarget) {
                    target = normalTarget;
                }
                else if (beaconTarget) {
                    target = beaconTarget;
                    isBeaconTarget = true;
                }
            }
            if (target) {
                // 目標がある場合：追跡・攻撃
                ship.targetVx = target.vx;
                ship.targetVy = target.vy;
                if (isBeaconTarget) {
                    // ビーコン検出のターゲットは索敵距離制限をバイパス
                    ship.thrustersActive = true;
                    ship.detectedTarget = true;
                    ship.update(target.x, target.y, true);
                }
                else {
                    ship.update(target.x, target.y);
                }
            }
            else {
                // 目標がない場合：停止状態（全チーム共通）
                ship.targetVx = 0;
                ship.targetVy = 0;
                // 停止状態（位置のみ更新、update()は呼ばない）
                ship.thrustersActive = false;
                ship.vx *= 0.95;
                ship.vy *= 0.95;
                ship.detectedTarget = false;
                const canvasWidth = canvas.width / window.devicePixelRatio;
                const canvasHeight = canvas.height / window.devicePixelRatio;
                // 移動
                ship.x += ship.vx;
                ship.y += ship.vy;
                // 画面端での反射
                if (ship.x < 0 || ship.x > canvasWidth) {
                    ship.vx *= -1;
                    ship.x = Math.max(0, Math.min(canvasWidth, ship.x));
                }
                if (ship.y < 0 || ship.y > canvasHeight) {
                    ship.vy *= -1;
                    ship.y = Math.max(0, Math.min(canvasHeight, ship.y));
                }
                // 摩擦
                ship.vx *= 0.98;
                ship.vy *= 0.98;
            }
            if (target && ship.shouldFire()) {
                const bullet = ship.fire();
                if (bullet)
                    bullets.push(bullet);
            }
            ship.draw();
        });
    }
    // ========================================
    // メインループ
    // ========================================
    function animate() {
        const canvasWidth = canvas.width / window.devicePixelRatio;
        const canvasHeight = canvas.height / window.devicePixelRatio;
        // 背景
        ctx.fillStyle = '#001a33';
        ctx.fillRect(0, 0, canvasWidth, canvasHeight);
        // 星
        stars.forEach(star => {
            ctx.fillStyle = `rgba(255, 255, 255, ${star.brightness})`;
            ctx.beginPath();
            ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
            ctx.fill();
        });
        // ビーコン更新と描画
        for (let i = detectionBeacons.length - 1; i >= 0; i--) {
            detectionBeacons[i].update();
            if (detectionBeacons[i].isAlive()) {
                detectionBeacons[i].draw();
            }
            else {
                detectionBeacons.splice(i, 1);
            }
        }
        // 統一されたチーム更新
        updateTeam(playerFleet, 'A', [...enemies, ...teamC]);
        updateTeam(enemies, 'B', [...playerFleet, ...teamC]);
        updateTeam(teamC, 'C', [...playerFleet, ...enemies]);
        // 衝突判定（相互作用）- すべての船と残骸に対して統一的に斥力を適用
        const allShips = [...playerFleet, ...enemies, ...teamC];
        for (let i = 0; i < allShips.length; i++) {
            for (let j = i + 1; j < allShips.length; j++) {
                if (allShips[i].collidesWith(allShips[j])) {
                    const dx = allShips[i].x - allShips[j].x;
                    const dy = allShips[i].y - allShips[j].y;
                    const dist = Math.hypot(dx, dy);
                    if (dist > 0) {
                        const pushForce = 0.5;
                        // 相互に反対方向の斥力を与える
                        allShips[i].vx += (dx / dist) * pushForce;
                        allShips[i].vy += (dy / dist) * pushForce;
                        allShips[j].vx -= (dx / dist) * pushForce;
                        allShips[j].vy -= (dy / dist) * pushForce;
                    }
                }
            }
        }
        // 弾の対象チーム選定マップ（各チームの弾が何を攻撃できるか）
        const bulletTargetMap = {
            '#99ddff': [{ ships: enemies, costVar: 'lostEnemyCost' }, { ships: teamC, costVar: 'lostTeamCCost' }], // チームAの弾
            '#ffccdd': [{ ships: playerFleet, costVar: 'lostPlayerCost' }, { ships: teamC, costVar: 'lostTeamCCost' }], // チームBの弾
            '#ffd24d': [{ ships: playerFleet, costVar: 'lostPlayerCost' }, { ships: enemies, costVar: 'lostEnemyCost' }] // チームCの弾
        };
        // 弾更新
        for (let i = bullets.length - 1; i >= 0; i--) {
            bullets[i].update();
            if (bullets[i].isAlive()) {
                let bulletHit = false;
                const targets = bulletTargetMap[bullets[i].color];
                if (targets) {
                    for (let targetGroup of targets) {
                        if (bulletHit)
                            break;
                        const ships = targetGroup.ships;
                        const costVarName = targetGroup.costVar;
                        for (let j = ships.length - 1; j >= 0; j--) {
                            if (bullets[i].collidesWith(ships[j])) {
                                const damageResult = ships[j].takeDamage(bullets[i].damage);
                                particles.push(...damageResult.particles);
                                // コスト更新
                                if (costVarName === 'lostPlayerCost')
                                    lostPlayerCost += damageResult.cost;
                                else if (costVarName === 'lostEnemyCost')
                                    lostEnemyCost += damageResult.cost;
                                else if (costVarName === 'lostTeamCCost')
                                    lostTeamCCost += damageResult.cost;
                                if (!ships[j].isAlive()) {
                                    particles.push(...ships[j].createExplosion());
                                    if (costVarName === 'lostPlayerCost')
                                        lostPlayerCost += ships[j].getCost();
                                    else if (costVarName === 'lostEnemyCost')
                                        lostEnemyCost += ships[j].getCost();
                                    else if (costVarName === 'lostTeamCCost')
                                        lostTeamCCost += ships[j].getCost();
                                    ships.splice(j, 1);
                                }
                                bulletHit = true;
                                break;
                            }
                        }
                    }
                }
                if (bulletHit) {
                    bullets.splice(i, 1);
                }
                else if (i >= 0 && i < bullets.length) {
                    bullets[i].draw();
                }
            }
            else {
                bullets.splice(i, 1);
            }
        }
        // パーティクル更新
        for (let i = particles.length - 1; i >= 0; i--) {
            particles[i].update();
            if (particles[i].isAlive()) {
                particles[i].draw();
            }
            else {
                particles.splice(i, 1);
            }
        }
        // 情報表示：コスト情報
        const currentPlayerCost = initialPlayerCost - lostPlayerCost;
        const currentEnemyCost = initialEnemyCost - lostEnemyCost;
        const currentTeamCCost = initialTeamCCost - lostTeamCCost;
        // 破壊されたシップ（射撃ユニットなし）は除外
        const currentPlayerShipCount = playerFleet.filter(ship => ship.weapons.length > 0).length;
        const currentEnemyShipCount = enemies.filter(ship => ship.weapons.length > 0).length;
        const currentTeamCShipCount = teamC.filter(ship => ship.weapons.length > 0).length;
        infoDiv.innerHTML = `
    <strong>チームA（水色）</strong><br>
    船体 ${currentPlayerShipCount}/${initialPlayerShipCount}${currentPlayerShipCount === 0 ? ' 全滅' : ''}<br>
    コスト ${currentPlayerCost}/${initialPlayerCost}<br>
    <br>
    <strong>チームB（桃色）</strong><br>
    船体 ${currentEnemyShipCount}/${initialEnemyShipCount}${currentEnemyShipCount === 0 ? ' 全滅' : ''}<br>
    コスト ${currentEnemyCost}/${initialEnemyCost}<br>
    <br>
    <strong>チームC（黄色）</strong><br>
    船体 ${currentTeamCShipCount}/${initialTeamCShipCount}${currentTeamCShipCount === 0 ? ' 全滅' : ''}<br>
    コスト ${currentTeamCCost}/${initialTeamCCost}<br>
                `;
        requestAnimationFrame(animate);
    }
    animate();
    window.addEventListener('resize', () => {
        resizeCanvas();
    });
        </script>
</body>
</html>
